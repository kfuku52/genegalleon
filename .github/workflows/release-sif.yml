name: release-sif

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag name (example: v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-sif-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
      release_sha: ${{ steps.vars.outputs.release_sha }}
      image: ${{ steps.vars.outputs.image }}
      immutable_tag: ${{ steps.vars.outputs.immutable_tag }}
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
      build_date: ${{ steps.vars.outputs.build_date }}
      gg_version: ${{ steps.vars.outputs.gg_version }}
      security_refresh_epoch: ${{ steps.vars.outputs.security_refresh_epoch }}
      sif_name: ${{ steps.vars.outputs.sif_name }}
      amalgkit_repo_sha: ${{ steps.vars.outputs.amalgkit_repo_sha }}
      cdskit_repo_sha: ${{ steps.vars.outputs.cdskit_repo_sha }}
      csubst_repo_sha: ${{ steps.vars.outputs.csubst_repo_sha }}
      nwkit_repo_sha: ${{ steps.vars.outputs.nwkit_repo_sha }}
      busco_repo_sha: ${{ steps.vars.outputs.busco_repo_sha }}
      paml_repo_sha: ${{ steps.vars.outputs.paml_repo_sha }}
      kfl1ou_repo_sha: ${{ steps.vars.outputs.kfl1ou_repo_sha }}
      kffractbias_repo_sha: ${{ steps.vars.outputs.kffractbias_repo_sha }}
      kftools_repo_sha: ${{ steps.vars.outputs.kftools_repo_sha }}
      rkftools_repo_sha: ${{ steps.vars.outputs.rkftools_repo_sha }}
      radte_repo_sha: ${{ steps.vars.outputs.radte_repo_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release, image tags, and source revisions
        id: vars
        shell: bash
        env:
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            release_tag="${RELEASE_EVENT_TAG}"
          else
            release_tag="${DISPATCH_RELEASE_TAG}"
          fi

          if [[ -z "${release_tag}" ]]; then
            echo "Release tag is empty."
            exit 1
          fi
          if [[ ! "${release_tag}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Release tag contains unsupported characters for container tags: ${release_tag}"
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/${release_tag}"; then
            echo "Release tag was not found in this repository: ${release_tag}"
            exit 1
          fi
          release_sha="$(git rev-list -n 1 "refs/tags/${release_tag}" 2>/dev/null || true)"
          if [[ -z "${release_sha}" ]]; then
            echo "Release tag did not resolve to a commit: ${release_tag}"
            exit 1
          fi
          git checkout --detach "${release_sha}"
          container/scripts/check_env_coverage.sh .

          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo_name="$(basename "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${repo_name}"
          date_tag="$(date -u +%Y%m%d)"
          short_sha="${release_sha:0:7}"
          build_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          security_refresh_epoch="$(date -u +%F)"
          gg_version="$(sed -n '1p' VERSION | tr -d '\r')"
          sif_name="${repo_name}_${release_tag}_amd64.sif"

          source container/source_branches.env
          resolve_source_sha() {
            bash container/scripts/resolve_git_branch_sha.sh "$1" "$2"
          }
          amalgkit_repo_sha="$(resolve_source_sha https://github.com/kfuku52/amalgkit.git "${GG_SOURCE_AMALGKIT_REPO_REF}")"
          cdskit_repo_sha="$(resolve_source_sha https://github.com/kfuku52/cdskit.git "${GG_SOURCE_CDSKIT_REPO_REF}")"
          csubst_repo_sha="$(resolve_source_sha https://github.com/kfuku52/csubst.git "${GG_SOURCE_CSUBST_REPO_REF}")"
          nwkit_repo_sha="$(resolve_source_sha https://github.com/kfuku52/nwkit.git "${GG_SOURCE_NWKIT_REPO_REF}")"
          busco_repo_sha="$(resolve_source_sha https://gitlab.com/ezlab/busco.git "${GG_SOURCE_BUSCO_REPO_REF}")"
          paml_repo_sha="$(resolve_source_sha https://github.com/iqtree/paml.git "${GG_SOURCE_PAML_REPO_REF}")"
          kfl1ou_repo_sha="$(resolve_source_sha https://github.com/kfuku52/kfl1ou.git "${GG_SOURCE_KFL1OU_REPO_REF}")"
          kffractbias_repo_sha="$(resolve_source_sha https://github.com/kfuku52/kfFractBias.git "${GG_SOURCE_KFFRACTBIAS_REPO_REF}")"
          kftools_repo_sha="$(resolve_source_sha https://github.com/kfuku52/kftools.git "${GG_SOURCE_KFTOOLS_REPO_REF}")"
          rkftools_repo_sha="$(resolve_source_sha https://github.com/kfuku52/rkftools.git "${GG_SOURCE_RKFTOOLS_REPO_REF}")"
          radte_repo_sha="$(resolve_source_sha https://github.com/kfuku52/RADTE.git "${GG_SOURCE_RADTE_REPO_REF}")"
          source_revision_hash="$(
            printf '%s\n' \
              "${amalgkit_repo_sha}" \
              "${cdskit_repo_sha}" \
              "${csubst_repo_sha}" \
              "${nwkit_repo_sha}" \
              "${busco_repo_sha}" \
              "${paml_repo_sha}" \
              "${kfl1ou_repo_sha}" \
              "${kffractbias_repo_sha}" \
              "${kftools_repo_sha}" \
              "${rkftools_repo_sha}" \
              "${radte_repo_sha}" \
              | sha256sum | cut -c1-12
          )"
          immutable_tag="${date_tag}-${short_sha}-${source_revision_hash}"

          {
            echo "release_tag=${release_tag}"
            echo "release_sha=${release_sha}"
            echo "image=${image}"
            echo "immutable_tag=${immutable_tag}"
            echo "sha_tag=sha-${short_sha}"
            echo "build_date=${build_date}"
            echo "gg_version=${gg_version}"
            echo "security_refresh_epoch=${security_refresh_epoch}"
            echo "sif_name=${sif_name}"
            echo "amalgkit_repo_sha=${amalgkit_repo_sha}"
            echo "cdskit_repo_sha=${cdskit_repo_sha}"
            echo "csubst_repo_sha=${csubst_repo_sha}"
            echo "nwkit_repo_sha=${nwkit_repo_sha}"
            echo "busco_repo_sha=${busco_repo_sha}"
            echo "paml_repo_sha=${paml_repo_sha}"
            echo "kfl1ou_repo_sha=${kfl1ou_repo_sha}"
            echo "kffractbias_repo_sha=${kffractbias_repo_sha}"
            echo "kftools_repo_sha=${kftools_repo_sha}"
            echo "rkftools_repo_sha=${rkftools_repo_sha}"
            echo "radte_repo_sha=${radte_repo_sha}"
          } >> "${GITHUB_OUTPUT}"

  build-platform:
    needs: prepare-release
    name: build-platform (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Resolve platform
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          echo "pair=${platform//\//-}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Compute build input hash
        id: build-input
        shell: bash
        env:
          GG_BUILD_PLATFORMS: ${{ matrix.platform }}
          GG_BUILD_VCS_REF: ${{ needs.prepare-release.outputs.release_sha }}
          GG_BUILD_VERSION: ${{ needs.prepare-release.outputs.gg_version }}
          GG_BUILD_SECURITY_REFRESH_EPOCH: ${{ needs.prepare-release.outputs.security_refresh_epoch }}
          KFU52_AMALGKIT_REPO_SHA: ${{ needs.prepare-release.outputs.amalgkit_repo_sha }}
          KFU52_CDSKIT_REPO_SHA: ${{ needs.prepare-release.outputs.cdskit_repo_sha }}
          KFU52_CSUBST_REPO_SHA: ${{ needs.prepare-release.outputs.csubst_repo_sha }}
          KFU52_NWKIT_REPO_SHA: ${{ needs.prepare-release.outputs.nwkit_repo_sha }}
          BUSCO_REPO_SHA: ${{ needs.prepare-release.outputs.busco_repo_sha }}
          PAML_REPO_SHA: ${{ needs.prepare-release.outputs.paml_repo_sha }}
          KFL1OU_REPO_SHA: ${{ needs.prepare-release.outputs.kfl1ou_repo_sha }}
          KFFRACTBIAS_REPO_SHA: ${{ needs.prepare-release.outputs.kffractbias_repo_sha }}
          KFTOOLS_REPO_SHA: ${{ needs.prepare-release.outputs.kftools_repo_sha }}
          RKFTOOLS_REPO_SHA: ${{ needs.prepare-release.outputs.rkftools_repo_sha }}
          RADTE_REPO_SHA: ${{ needs.prepare-release.outputs.radte_repo_sha }}
        run: |
          set -euo pipefail
          build_input_hash="$(bash container/scripts/compute_build_input_hash.sh "${GG_BUILD_SECURITY_REFRESH_EPOCH}")"
          runtime_input_hash="$(bash container/scripts/compute_build_input_hash.sh --runtime "${GG_BUILD_SECURITY_REFRESH_EPOCH}")"
          if [[ ! "${build_input_hash}" =~ ^[0-9a-f]{64}$ || ! "${runtime_input_hash}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Build input hash calculation returned an invalid digest." >&2
            exit 1
          fi
          printf 'value=%s\nruntime_value=%s\n' \
            "${build_input_hash}" "${runtime_input_hash}" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native platform image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: container/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: >-
            type=image,name=${{ needs.prepare-release.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare-release.outputs.release_sha }}
          build-args: |
            BUILD_DATE=${{ needs.prepare-release.outputs.build_date }}
            VCS_REF=${{ needs.prepare-release.outputs.release_sha }}
            GG_VERSION=${{ needs.prepare-release.outputs.gg_version }}
            BUILD_INPUT_HASH=${{ steps.build-input.outputs.value }}
            RUNTIME_INPUT_HASH=${{ steps.build-input.outputs.runtime_value }}
            SECURITY_REFRESH_EPOCH=${{ needs.prepare-release.outputs.security_refresh_epoch }}
            KFU52_REPO_REF=master
            KFU52_AMALGKIT_REPO_REF=master
            KFU52_AMALGKIT_REPO_SHA=${{ needs.prepare-release.outputs.amalgkit_repo_sha }}
            KFU52_CDSKIT_REPO_REF=master
            KFU52_CDSKIT_REPO_SHA=${{ needs.prepare-release.outputs.cdskit_repo_sha }}
            KFU52_CSUBST_REPO_REF=master
            KFU52_CSUBST_REPO_SHA=${{ needs.prepare-release.outputs.csubst_repo_sha }}
            KFU52_NWKIT_REPO_REF=master
            KFU52_NWKIT_REPO_SHA=${{ needs.prepare-release.outputs.nwkit_repo_sha }}
            BUSCO_REPO_REF=master
            BUSCO_REPO_SHA=${{ needs.prepare-release.outputs.busco_repo_sha }}
            PAML_REPO_REF=master
            PAML_REPO_SHA=${{ needs.prepare-release.outputs.paml_repo_sha }}
            KFL1OU_REPO_REF=main
            KFL1OU_REPO_SHA=${{ needs.prepare-release.outputs.kfl1ou_repo_sha }}
            KFFRACTBIAS_REPO_REF=master
            KFFRACTBIAS_REPO_SHA=${{ needs.prepare-release.outputs.kffractbias_repo_sha }}
            KFTOOLS_REPO_SHA=${{ needs.prepare-release.outputs.kftools_repo_sha }}
            RKFTOOLS_REPO_SHA=${{ needs.prepare-release.outputs.rkftools_repo_sha }}
            RADTE_REPO_SHA=${{ needs.prepare-release.outputs.radte_repo_sha }}
          # Reuse the same per-platform cache scopes as container-ghcr.yml.
          cache-from: type=gha,scope=container-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=container-${{ steps.platform.outputs.pair }}

      - name: Validate release runtime contracts
        shell: bash
        env:
          IMAGE: ${{ needs.prepare-release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" ]]; then
            echo "docker/build-push-action did not return an image digest."
            exit 1
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            "${IMAGE}@${DIGEST}" \
            python -m pytest -q --gg-suite runtime workflow/tests

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if [[ -z "${digest}" ]]; then
            echo "docker/build-push-action did not return an image digest."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-digests-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest-and-sif:
    needs:
      - prepare-release
      - build-platform
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Reclaim runner disk space for SIF conversion
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk usage before cleanup:"
          df -h /
          sudo rm -rf -- \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/share/dotnet
          sudo apt-get clean
          docker system prune --all --force --volumes
          echo "Disk usage after cleanup:"
          df -h /

      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: release-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute expected release runtime input
        id: runtime-input
        shell: bash
        env:
          GG_BUILD_SECURITY_REFRESH_EPOCH: ${{ needs.prepare-release.outputs.security_refresh_epoch }}
          KFU52_AMALGKIT_REPO_SHA: ${{ needs.prepare-release.outputs.amalgkit_repo_sha }}
          KFU52_CDSKIT_REPO_SHA: ${{ needs.prepare-release.outputs.cdskit_repo_sha }}
          KFU52_CSUBST_REPO_SHA: ${{ needs.prepare-release.outputs.csubst_repo_sha }}
          KFU52_NWKIT_REPO_SHA: ${{ needs.prepare-release.outputs.nwkit_repo_sha }}
          BUSCO_REPO_SHA: ${{ needs.prepare-release.outputs.busco_repo_sha }}
          PAML_REPO_SHA: ${{ needs.prepare-release.outputs.paml_repo_sha }}
          KFL1OU_REPO_SHA: ${{ needs.prepare-release.outputs.kfl1ou_repo_sha }}
          KFFRACTBIAS_REPO_SHA: ${{ needs.prepare-release.outputs.kffractbias_repo_sha }}
          KFTOOLS_REPO_SHA: ${{ needs.prepare-release.outputs.kftools_repo_sha }}
          RKFTOOLS_REPO_SHA: ${{ needs.prepare-release.outputs.rkftools_repo_sha }}
          RADTE_REPO_SHA: ${{ needs.prepare-release.outputs.radte_repo_sha }}
        run: |
          set -euo pipefail
          value="$(bash container/scripts/compute_build_input_hash.sh --runtime "${GG_BUILD_SECURITY_REFRESH_EPOCH}")"
          if [[ ! "${value}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Release runtime input calculation returned an invalid digest." >&2
            exit 1
          fi
          printf 'value=%s\n' "${value}" >> "${GITHUB_OUTPUT}"

      - name: Create and push multi-arch release manifest
        shell: bash
        env:
          IMAGE: ${{ needs.prepare-release.outputs.image }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          IMMUTABLE_TAG: ${{ needs.prepare-release.outputs.immutable_tag }}
          SHA_TAG: ${{ needs.prepare-release.outputs.sha_tag }}
        run: |
          set -euo pipefail
          mapfile -t digests < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#digests[@]}."
            exit 1
          fi

          refs=()
          for digest in "${digests[@]}"; do
            refs+=("${IMAGE}@sha256:${digest}")
          done

          immutable_exists=0
          if existing_manifest="$(docker buildx imagetools inspect --raw "${IMAGE}:${IMMUTABLE_TAG}" 2>/dev/null)"; then
            immutable_exists=1
            planned_manifest="$(docker buildx imagetools create --dry-run --progress=none "${refs[@]}")"
            planned_fingerprint="$(
              jq -S -c '{schemaVersion, mediaType, manifests}' <<< "${planned_manifest}" | sha256sum | cut -d' ' -f1
            )"
            existing_fingerprint="$(
              jq -S -c '{schemaVersion, mediaType, manifests}' <<< "${existing_manifest}" | sha256sum | cut -d' ' -f1
            )"
            if [[ "${planned_fingerprint}" != "${existing_fingerprint}" ]]; then
              echo "Refusing to overwrite immutable image tag with different content: ${IMAGE}:${IMMUTABLE_TAG}"
              exit 1
            fi
            echo "Immutable image tag already matches the planned manifest; reusing it."
          fi

          manifest_tags=(
            --tag "${IMAGE}:${RELEASE_TAG}"
            --tag "${IMAGE}:${SHA_TAG}"
          )
          if [[ "${immutable_exists}" == "0" ]]; then
            manifest_tags+=(--tag "${IMAGE}:${IMMUTABLE_TAG}")
          fi
          docker buildx imagetools create "${manifest_tags[@]}" "${refs[@]}"

      - name: Install Singularity runtime
        id: runtime
        shell: bash
        env:
          SINGULARITY_CE_VERSION: "4.5.0"
          SINGULARITY_CE_DEB_SHA256: "85e6f7af5e7aad5b1bf28183ce333998bd37eb8f4769af352c47a5153f3373fb"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          deb_name="singularity-ce_${SINGULARITY_CE_VERSION}-noble_amd64.deb"
          deb_path="${RUNNER_TEMP}/${deb_name}"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 5 \
            --retry-all-errors \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "${deb_path}" \
            "https://github.com/sylabs/singularity/releases/download/v${SINGULARITY_CE_VERSION}/${deb_name}"
          printf '%s  %s\n' "${SINGULARITY_CE_DEB_SHA256}" "${deb_path}" \
            | sha256sum --check --strict
          sudo apt-get install -y "${deb_path}"
          if ! command -v singularity >/dev/null 2>&1; then
            echo "SingularityCE installation did not provide the singularity command."
            exit 1
          fi
          installed_version="$(singularity version)"
          expected_version="${SINGULARITY_CE_VERSION}-noble"
          if [[ "${installed_version}" != "${expected_version}" ]]; then
            echo "Expected SingularityCE ${expected_version}, found ${installed_version}."
            exit 1
          fi
          echo "SingularityCE ${installed_version}"
          echo "engine=singularity" >> "${GITHUB_OUTPUT}"

      - name: Build SIF from immutable GHCR tag
        shell: bash
        env:
          APPTAINER_CACHEDIR: ${{ runner.temp }}/apptainer-cache
          APPTAINER_DISABLE_CACHE: "1"
          APPTAINER_TMPDIR: ${{ runner.temp }}/apptainer-tmp
          SINGULARITY_CACHEDIR: ${{ runner.temp }}/singularity-cache
          SINGULARITY_DISABLE_CACHE: "1"
          SINGULARITY_TMPDIR: ${{ runner.temp }}/singularity-tmp
          TMPDIR: ${{ runner.temp }}/singularity-transport-tmp
          IMAGE: ${{ needs.prepare-release.outputs.image }}
          TAG: ${{ needs.prepare-release.outputs.immutable_tag }}
          ENGINE: ${{ steps.runtime.outputs.engine }}
          OUT: ${{ needs.prepare-release.outputs.sif_name }}
        run: |
          set -euo pipefail
          mkdir -p \
            "${APPTAINER_CACHEDIR}" \
            "${APPTAINER_TMPDIR}" \
            "${SINGULARITY_CACHEDIR}" \
            "${SINGULARITY_TMPDIR}" \
            "${TMPDIR}"
          required_bytes=$((15 * 1024 * 1024 * 1024))
          available_bytes="$(df --output=avail -B1 "${RUNNER_TEMP}" | awk 'NR == 2 { print $1 }')"
          printf 'SIF disk preflight: required_free=%s available=%s bytes\n' \
            "${required_bytes}" "${available_bytes}"
          if (( available_bytes < required_bytes )); then
            echo "::error::Insufficient disk space for SIF conversion: need ${required_bytes} bytes, have ${available_bytes} bytes."
            exit 1
          fi
          df -h /
          free -h
          bash container/apptainer_from_docker.sh
          sha256sum "${OUT}" > "${OUT}.sha256"

      - name: Verify exact release SIF identity
        shell: bash
        env:
          SIF_PATH: ${{ needs.prepare-release.outputs.sif_name }}
          SIF_ENGINE: ${{ steps.runtime.outputs.engine }}
          EXPECTED_RUNTIME_INPUT: ${{ steps.runtime-input.outputs.value }}
        run: |
          set -euo pipefail
          GG_RUNTIME_FRESHNESS=off \
          bash container/scripts/check_runtime_freshness.sh \
            --sif "${SIF_PATH}" \
            --engine "${SIF_ENGINE}" \
            --expected-hash "${EXPECTED_RUNTIME_INPUT}"

      - name: Validate release SIF runtime contracts
        shell: bash
        env:
          GENEGALLEON_SIF: ${{ needs.prepare-release.outputs.sif_name }}
        run: |
          set -euo pipefail
          bash workflow/tests/run_in_sif.sh \
            python -m pytest -q --gg-suite runtime workflow/tests

      - name: Report SIF conversion disk usage
        if: always()
        shell: bash
        run: |
          set -u
          df -h /
          free -h
          du -sh \
            "${RUNNER_TEMP}/apptainer-cache" \
            "${RUNNER_TEMP}/apptainer-tmp" \
            "${RUNNER_TEMP}/singularity-cache" \
            "${RUNNER_TEMP}/singularity-tmp" \
            "${RUNNER_TEMP}/singularity-transport-tmp" \
            2>/dev/null || true

      - name: Resolve SIF upload strategy
        id: sif_meta
        shell: bash
        run: |
          set -euo pipefail
          sif_file="${{ needs.prepare-release.outputs.sif_name }}"
          limit_bytes=2147483648
          size_bytes=$(stat -c '%s' "${sif_file}")
          echo "size_bytes=${size_bytes}" >> "${GITHUB_OUTPUT}"
          if (( size_bytes < limit_bytes )); then
            echo "upload_to_release=1" >> "${GITHUB_OUTPUT}"
          else
            echo "upload_to_release=0" >> "${GITHUB_OUTPUT}"
            notice_file="${sif_file}.download.txt"
            {
              echo "SIF is larger than GitHub Release asset size limit (2 GiB)."
              echo "Download it from this workflow run artifact:"
              echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } > "${notice_file}"
            echo "notice_file=${notice_file}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload SIF files to GitHub Release
        if: steps.sif_meta.outputs.upload_to_release == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ needs.prepare-release.outputs.release_tag }}" \
            "${{ needs.prepare-release.outputs.sif_name }}" \
            "${{ needs.prepare-release.outputs.sif_name }}.sha256" \
            --clobber

      - name: Upload large SIF as workflow artifact
        if: steps.sif_meta.outputs.upload_to_release != '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.prepare-release.outputs.sif_name }}
          path: ${{ needs.prepare-release.outputs.sif_name }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload checksum and download notice to GitHub Release
        if: steps.sif_meta.outputs.upload_to_release != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ needs.prepare-release.outputs.release_tag }}" \
            "${{ needs.prepare-release.outputs.sif_name }}.sha256" \
            "${{ steps.sif_meta.outputs.notice_file }}" \
            --clobber

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Pushed image tags:"
            echo "- ${{ needs.prepare-release.outputs.image }}:${{ needs.prepare-release.outputs.release_tag }}"
            echo "- ${{ needs.prepare-release.outputs.image }}:${{ needs.prepare-release.outputs.immutable_tag }}"
            echo "- ${{ needs.prepare-release.outputs.image }}:${{ needs.prepare-release.outputs.sha_tag }}"
            echo ""
            echo "Platforms were built concurrently on native amd64 and arm64 runners."
            echo "Ubuntu security refresh epoch: ${{ needs.prepare-release.outputs.security_refresh_epoch }}"
            echo "SIF size (bytes): ${{ steps.sif_meta.outputs.size_bytes }}"
            if [[ "${{ steps.sif_meta.outputs.upload_to_release }}" == "1" ]]; then
              echo "Uploaded release assets:"
              echo "- ${{ needs.prepare-release.outputs.sif_name }}"
              echo "- ${{ needs.prepare-release.outputs.sif_name }}.sha256"
            else
              echo "SIF exceeded GitHub Release size limit and was uploaded as a workflow artifact."
              echo "Uploaded release assets:"
              echo "- ${{ needs.prepare-release.outputs.sif_name }}.sha256"
              echo "- ${{ steps.sif_meta.outputs.notice_file }}"
              echo "Workflow artifact:"
              echo "- ${{ needs.prepare-release.outputs.sif_name }}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
