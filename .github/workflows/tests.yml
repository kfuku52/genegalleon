name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  runtime-change-filter:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}

    steps:
      - name: Checkout history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect container-runtime changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          should_run=0
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            should_run=1
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            should_run=1
          else
            while IFS= read -r path; do
              case "${path}" in
                .dockerignore|VERSION|gg_container_build_entrypoint.sh|container/*|workflow/*|.github/workflows/tests.yml)
                  should_run=1
                  break
                  ;;
              esac
            done < <(git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}")
          fi
          echo "should_run=${should_run}" >> "${GITHUB_OUTPUT}"

  python-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            workflow/tests/requirements-smoke.txt
            workflow/tests/requirements.lock.txt

      - name: Install test dependencies
        run: |
          python -m pip install \
            --constraint workflow/tests/requirements.lock.txt \
            --requirement workflow/tests/requirements-smoke.txt

      - name: Run smoke tests
        run: |
          python -m pytest -q -x \
            --gg-suite smoke \
            --durations=25 \
            --durations-min=0.5 \
            workflow/tests

  python-fast:
    needs: python-smoke
    name: python-fast (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            workflow/tests/requirements.txt
            workflow/tests/requirements.lock.txt

      - name: Install test dependencies
        run: |
          python -m pip install \
            --constraint workflow/tests/requirements.lock.txt \
            --requirement workflow/tests/requirements.txt

      - name: Run fast Python tests
        run: |
          python -m pytest -q \
            -n 2 \
            --dist load \
            --gg-suite fast \
            --durations=25 \
            --durations-min=0.5 \
            workflow/tests

  python-heavy:
    needs: python-smoke
    name: python-heavy (${{ matrix.shard.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        shard:
          - name: download-and-traits
            suite: integration-download
          - name: workflow-integrations
            suite: integration-workflow

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            workflow/tests/requirements.txt
            workflow/tests/requirements.lock.txt

      - name: Install test dependencies
        run: |
          python -m pip install \
            --constraint workflow/tests/requirements.lock.txt \
            --requirement workflow/tests/requirements.txt

      - name: Run heavy Python tests
        run: |
          python -m pytest -q \
            -n 2 \
            --dist load \
            --gg-suite "${{ matrix.shard.suite }}" \
            --durations=25 \
            --durations-min=0.5 \
            workflow/tests

  shell-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install minimal test dependency
        run: |
          python -m pip install \
            --constraint workflow/tests/requirements.lock.txt \
            pytest pyyaml ruff

      - name: Install shell and workflow linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate GitHub Actions workflows
        run: |
          "$(go env GOPATH)/bin/actionlint"

      - name: Bash syntax check for workflow scripts
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "${script}"
          done < <(find workflow -type f -name "*.sh" | sort)

      - name: ShellCheck all tracked shell scripts
        run: |
          set -euo pipefail
          mapfile -d '' -t scripts < <(git ls-files -z '*.sh')
          scripts+=(dev)
          shellcheck -S warning -x \
            -e SC1091,SC2034,SC2154,SC2317 \
            "${scripts[@]}"

      - name: Ruff check all Python sources
        run: |
          python -m ruff check workflow

      - name: Shell static safety checks
        run: |
          python -m pytest -q \
            --gg-suite static \
            --durations=25 \
            --durations-min=0.5 \
            workflow/tests

  r-script-parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Install R test dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          cache: always
          packages: any::sessioninfo
          extra-packages: |
            any::ggplot2
            any::ape
            kfuku52/rkftools@master

      - name: Parse-check workflow R scripts
        run: |
          Rscript workflow/tests/test_r_scripts_parse.R

      - name: Run lightweight R unit tests
        run: |
          Rscript workflow/tests/test_pgls_common_rphylopars.R
          Rscript workflow/tests/test_r_species_label_utils.R

  sif-runtime-validation:
    needs:
      - runtime-change-filter
      - python-smoke
      - shell-static
    if: needs.runtime-change-filter.outputs.should_run == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve exact validation runtime input
        id: runtime-input
        shell: bash
        run: |
          set -euo pipefail
          security_refresh_epoch="$(date -u +%F)"
          resolved_sources="${RUNNER_TEMP}/resolved-sources.env"
          bash container/scripts/resolve_source_revisions.sh \
            --format env \
            --scope all \
            > "${resolved_sources}"
          set -a
          # shellcheck disable=SC1090
          source "${resolved_sources}"
          set +a
          export GG_BUILD_PLATFORMS=linux/amd64
          export GG_BUILD_VCS_REF=runtime-validation
          export GG_BUILD_VERSION=runtime-validation
          runtime_input="$(
            bash container/scripts/compute_build_input_hash.sh \
              --runtime \
              "${security_refresh_epoch}"
          )"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo_name="$(basename "${GITHUB_REPOSITORY}")"
          {
            echo "value=${runtime_input}"
            echo "security_refresh_epoch=${security_refresh_epoch}"
            echo "published_image=ghcr.io/${owner}/${repo_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore exact validation SIF
        id: sif-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: genegalleon.sif
          key: sif-runtime-${{ runner.os }}-${{ runner.arch }}-singularity-4.5.0-${{ steps.runtime-input.outputs.value }}

      - name: Reclaim runner disk space for SIF conversion
        if: steps.sif-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk usage before cleanup:"
          df -h /
          sudo rm -rf -- \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/share/dotnet
          sudo apt-get clean
          docker system prune --all --force --volumes
          echo "Disk usage after cleanup:"
          df -h /

      - name: Set up Docker Buildx
        if: steps.sif-cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Expose GitHub runtime for BuildKit cache
        if: steps.sif-cache.outputs.cache-hit != 'true'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4

      - name: Select published or local validation image
        if: steps.sif-cache.outputs.cache-hit != 'true'
        id: validation-image
        shell: bash
        env:
          EXPECTED_RUNTIME_INPUT: ${{ steps.runtime-input.outputs.value }}
          PUBLISHED_IMAGE: ${{ steps.runtime-input.outputs.published_image }}
        run: |
          set -euo pipefail
          image_metadata="$(
            docker buildx imagetools inspect \
              --format '{{json .Image}}' \
              "${PUBLISHED_IMAGE}:latest" \
              2>/dev/null || true
          )"
          if [[ -n "${image_metadata}" ]] && \
             python container/scripts/check_published_build_input.py \
               --label io.genegalleon.runtime-input \
               --expected "linux/amd64=${EXPECTED_RUNTIME_INPUT}" \
               <<< "${image_metadata}"; then
            echo "source=registry" >> "${GITHUB_OUTPUT}"
            echo "Published image has the exact validation runtime input."
          else
            echo "source=local" >> "${GITHUB_OUTPUT}"
            echo "Published runtime is missing or stale; building the current runtime."
          fi

      - name: Build current GeneGalleon image
        if: steps.sif-cache.outputs.cache-hit != 'true' && steps.validation-image.outputs.source == 'local'
        shell: bash
        env:
          CACHE_FROM: type=gha,scope=container-linux-amd64
          CACHE_TO: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'type=gha,mode=max,scope=container-linux-amd64,ignore-error=true' || '' }}
          SECURITY_REFRESH_EPOCH: ${{ steps.runtime-input.outputs.security_refresh_epoch }}
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "${RUNNER_TEMP}/resolved-sources.env"
          set +a
          BUILD_SIF=0 \
          IMAGE_SOURCE=local \
          IMAGE=local/genegalleon \
          TAG=ci \
          MODE=load \
          PLATFORMS=linux/amd64 \
          FORCE_LOAD_IN_CI=1 \
            bash ./gg_container_build_entrypoint.sh

      - name: Reclaim BuildKit cache before SIF conversion
        if: steps.sif-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Container storage before BuildKit cleanup:"
          docker system df
          docker buildx prune --all --force
          echo "Disk usage after BuildKit cleanup:"
          df -h /
          if [[ "${{ steps.validation-image.outputs.source }}" == "local" ]]; then
            docker system df
            image_bytes="$(docker image inspect --format '{{.Size}}' local/genegalleon:ci)"
            reserve_bytes=$((6 * 1024 * 1024 * 1024))
            required_bytes=$((2 * image_bytes + reserve_bytes))
            available_bytes="$(df --output=avail -B1 "${RUNNER_TEMP}" | awk 'NR == 2 { print $1 }')"
            printf 'SIF disk preflight: image=%s required_free=%s available=%s bytes\n' \
              "${image_bytes}" "${required_bytes}" "${available_bytes}"
            if (( available_bytes < required_bytes )); then
              echo "::error::Insufficient disk space for SIF conversion: need ${required_bytes} bytes, have ${available_bytes} bytes."
              exit 1
            fi
          fi
          free -h

      - name: Install Singularity runtime
        id: runtime
        shell: bash
        env:
          SINGULARITY_CE_VERSION: "4.5.0"
          SINGULARITY_CE_DEB_SHA256: "85e6f7af5e7aad5b1bf28183ce333998bd37eb8f4769af352c47a5153f3373fb"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          deb_name="singularity-ce_${SINGULARITY_CE_VERSION}-noble_amd64.deb"
          deb_path="${RUNNER_TEMP}/${deb_name}"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 5 \
            --retry-all-errors \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "${deb_path}" \
            "https://github.com/sylabs/singularity/releases/download/v${SINGULARITY_CE_VERSION}/${deb_name}"
          printf '%s  %s\n' "${SINGULARITY_CE_DEB_SHA256}" "${deb_path}" \
            | sha256sum --check --strict
          sudo apt-get install -y "${deb_path}"
          if ! command -v singularity >/dev/null 2>&1; then
            echo "SingularityCE installation did not provide the singularity command."
            exit 1
          fi
          installed_version="$(singularity version)"
          expected_version="${SINGULARITY_CE_VERSION}-noble"
          if [[ "${installed_version}" != "${expected_version}" ]]; then
            echo "Expected SingularityCE ${expected_version}, found ${installed_version}."
            exit 1
          fi
          echo "SingularityCE ${installed_version}"
          echo "engine=singularity" >> "${GITHUB_OUTPUT}"

      - name: Build validation SIF from current image
        if: steps.sif-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          APPTAINER_CACHEDIR: ${{ runner.temp }}/apptainer-cache
          APPTAINER_DISABLE_CACHE: "1"
          APPTAINER_TMPDIR: ${{ runner.temp }}/apptainer-tmp
          SINGULARITY_CACHEDIR: ${{ runner.temp }}/singularity-cache
          SINGULARITY_DISABLE_CACHE: "1"
          SINGULARITY_TMPDIR: ${{ runner.temp }}/singularity-tmp
          TMPDIR: ${{ runner.temp }}/singularity-transport-tmp
        run: |
          set -euo pipefail
          mkdir -p \
            "${APPTAINER_CACHEDIR}" \
            "${APPTAINER_TMPDIR}" \
            "${SINGULARITY_CACHEDIR}" \
            "${SINGULARITY_TMPDIR}" \
            "${TMPDIR}"
          echo "Disk usage before SIF conversion:"
          df -h /
          if [[ "${{ steps.validation-image.outputs.source }}" == "registry" ]]; then
            source_type=docker
            image="${{ steps.runtime-input.outputs.published_image }}"
            tag=latest
          else
            source_type=docker-daemon
            image=local/genegalleon
            tag=ci
          fi
          SOURCE="${source_type}" \
          IMAGE="${image}" \
          TAG="${tag}" \
          ENGINE="${{ steps.runtime.outputs.engine }}" \
          OUT="${GITHUB_WORKSPACE}/genegalleon.sif" \
            bash container/apptainer_from_docker.sh
          {
            echo "SIF validation image:"
            echo "- ${image}:${tag}"
            echo "- runtime input: ${{ steps.runtime-input.outputs.value }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify exact validation SIF identity
        shell: bash
        run: |
          GG_RUNTIME_FRESHNESS=off \
          bash container/scripts/check_runtime_freshness.sh \
            --sif "${GITHUB_WORKSPACE}/genegalleon.sif" \
            --engine "${{ steps.runtime.outputs.engine }}" \
            --expected-hash "${{ steps.runtime-input.outputs.value }}"

      - name: Report SIF conversion disk usage
        if: always() && steps.sif-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -u
          df -h /
          free -h
          docker system df || true
          du -sh \
            "${RUNNER_TEMP}/apptainer-cache" \
            "${RUNNER_TEMP}/apptainer-tmp" \
            "${RUNNER_TEMP}/singularity-cache" \
            "${RUNNER_TEMP}/singularity-tmp" \
            "${RUNNER_TEMP}/singularity-transport-tmp" \
            2>/dev/null || true

      - name: Run SIF validation checks
        run: |
          bash workflow/tests/run_in_sif.sh python -m pytest -q --gg-suite runtime workflow/tests
          bash workflow/tests/run_in_sif.sh python -m pytest -q workflow/tests/test_hgt_end_to_end.py
          bash workflow/tests/run_in_sif.sh python -m pytest -q workflow/tests/test_format_species_inputs_provider_pages.py::test_download_manifest_figshare_extracts_rar_member_from_extensionless_url
          bash workflow/tests/run_in_sif.sh bash workflow/tests/check_treevis_package.sh
          bash workflow/tests/run_in_sif.sh Rscript workflow/tests/test_orthogroup_copy_number_trait_pgls.R
          bash workflow/tests/run_in_sif.sh Rscript workflow/tests/test_treevis_main.R

      - name: Save validated SIF by exact runtime input
        if: >-
          steps.sif-cache.outputs.cache-hit != 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: genegalleon.sif
          key: ${{ steps.sif-cache.outputs.cache-primary-key }}
