name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cached_runtime_input:
        description: "Validated SIF runtime-input hash for a one-off reproduction; empty follows current upstream branches"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  runtime-change-filter:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}

    steps:
      - name: Checkout history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect container-runtime changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          should_run=0
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            should_run=1
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            should_run=1
          else
            while IFS= read -r path; do
              case "${path}" in
                .dockerignore|dev|pyproject.toml|gg_container_build_entrypoint.sh|container/*|workflow/*|.github/workflows/tests.yml|.github/actions/*)
                  should_run=1
                  break
                  ;;
              esac
            done < <(git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}")
          fi
          echo "should_run=${should_run}" >> "${GITHUB_OUTPUT}"

  python-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            workflow/tests/requirements-smoke.txt
            workflow/tests/requirements.lock.txt

      - name: Install test dependencies
        run: |
          python -m pip install \
            --constraint workflow/tests/requirements.lock.txt \
            --requirement workflow/tests/requirements-smoke.txt

      - name: Run smoke tests
        run: |
          python -m pytest -q -x \
            --gg-suite smoke \
            --durations=25 \
            --durations-min=0.5 \
            workflow/tests

  python-wheels:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve moving test dependencies once
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source container/source_branches.env
          cdskit_sha="$(bash container/scripts/resolve_git_branch_sha.sh https://github.com/kfuku52/cdskit.git "${GG_SOURCE_CDSKIT_REPO_REF}")"
          [[ "${cdskit_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "cdskit_sha=${cdskit_sha}" >> "${GITHUB_OUTPUT}"
          csubst_sha="$(bash container/scripts/resolve_git_branch_sha.sh https://github.com/kfuku52/csubst.git "${GG_SOURCE_CSUBST_REPO_REF}")"
          [[ "${csubst_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "csubst_sha=${csubst_sha}" >> "${GITHUB_OUTPUT}"
          nwkit_sha="$(bash container/scripts/resolve_git_branch_sha.sh https://github.com/kfuku52/nwkit.git "${GG_SOURCE_NWKIT_REPO_REF}")"
          [[ "${nwkit_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "nwkit_sha=${nwkit_sha}" >> "${GITHUB_OUTPUT}"
          kffractbias_sha="$(bash container/scripts/resolve_git_branch_sha.sh https://github.com/kfuku52/kfFractBias.git "${GG_SOURCE_KFFRACTBIAS_REPO_REF}")"
          [[ "${kffractbias_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "kffractbias_sha=${kffractbias_sha}" >> "${GITHUB_OUTPUT}"

      - name: Restore test wheels by resolved source and constraints
        id: wheels-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/gg-test-wheels
          key: test-wheels-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('workflow/tests/requirements.txt', 'workflow/tests/requirements.lock.txt', 'workflow/tests/prepare_test_wheels.py') }}-${{ steps.source.outputs.csubst_sha }}-${{ steps.source.outputs.nwkit_sha }}-${{ steps.source.outputs.cdskit_sha }}-${{ steps.source.outputs.kffractbias_sha }}

      - name: Build missing test wheels
        if: steps.wheels-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          CDSKIT_SHA: ${{ steps.source.outputs.cdskit_sha }}
          CSUBST_SHA: ${{ steps.source.outputs.csubst_sha }}
          NWKIT_SHA: ${{ steps.source.outputs.nwkit_sha }}
          KFFRACTBIAS_SHA: ${{ steps.source.outputs.kffractbias_sha }}
        run: |
          set -euo pipefail
          python workflow/tests/prepare_test_wheels.py \
            --directory "${RUNNER_TEMP}/gg-test-wheels" --csubst-sha "${CSUBST_SHA}" --nwkit-sha "${NWKIT_SHA}" --cdskit-sha "${CDSKIT_SHA}" --kffractbias-sha "${KFFRACTBIAS_SHA}"
          python -m pip wheel \
            --constraint workflow/tests/requirements.lock.txt \
            --requirement "${RUNNER_TEMP}/gg-test-wheels/build-requirements.txt" \
            --wheel-dir "${RUNNER_TEMP}/gg-test-wheels"

      - name: Save trusted test wheels
        if: >-
          steps.wheels-cache.outputs.cache-hit != 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/gg-test-wheels
          key: ${{ steps.wheels-cache.outputs.cache-primary-key }}

      - name: Share exact wheels with parallel test lanes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-test-wheels
          path: ${{ runner.temp }}/gg-test-wheels
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  python-fast-shards:
    needs: [python-smoke, python-wheels]
    name: python-fast (Python 3.12, ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download exact test wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-test-wheels
          path: ${{ runner.temp }}/gg-test-wheels

      - name: Install test dependencies
        run: |
          python -m pip install --no-index \
            --find-links "${RUNNER_TEMP}/gg-test-wheels" \
            --constraint workflow/tests/requirements.lock.txt \
            --requirement "${RUNNER_TEMP}/gg-test-wheels/install-requirements.txt"

      - name: Install required sequence tools
        run: |
          sudo apt-get update
          sudo apt-get install -y seqkit
          seqkit version

      - name: Run fast Python tests
        env:
          TEST_SHARD: ${{ matrix.shard }}/2
        run: |
          python -m pytest -q \
            -n 2 \
            --dist load \
            --gg-suite fast \
            --gg-shard="${TEST_SHARD}" \
            --durations=25 \
            --durations-min=0.5 \
            workflow/tests

  python-fast:
    name: python-fast (Python 3.12)
    needs: [python-fast-shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every fast partition
        env:
          PARTITIONS_RESULT: ${{ needs.python-fast-shards.result }}
        run: test "${PARTITIONS_RESULT}" = success

  python-heavy:
    needs: [python-smoke, python-wheels]
    name: python-heavy (${{ matrix.shard.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: download-and-traits
            suite: integration-download
            partition: 1/1
          - name: workflow-integrations-1
            suite: integration-workflow
            partition: 1/3
          - name: workflow-integrations-2
            suite: integration-workflow
            partition: 2/3
          - name: workflow-integrations-3
            suite: integration-workflow
            partition: 3/3

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download exact test wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-test-wheels
          path: ${{ runner.temp }}/gg-test-wheels

      - name: Install test dependencies
        run: |
          python -m pip install --no-index \
            --find-links "${RUNNER_TEMP}/gg-test-wheels" \
            --constraint workflow/tests/requirements.lock.txt \
            --requirement "${RUNNER_TEMP}/gg-test-wheels/install-requirements.txt"

      - name: Run heavy Python tests
        env:
          TEST_SUITE: ${{ matrix.shard.suite }}
          TEST_SHARD: ${{ matrix.shard.partition }}
        run: |
          python -m pytest -q \
            -n 2 \
            --dist load \
            --gg-suite "${TEST_SUITE}" \
            --gg-shard="${TEST_SHARD}" \
            --durations=25 \
            --durations-min=0.5 \
            workflow/tests

  shell-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install minimal test dependency
        run: |
          python -m pip install \
            --constraint workflow/tests/requirements.lock.txt \
            pytest pyyaml ruff

      - name: Install shell and workflow linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate GitHub Actions workflows
        run: |
          "$(go env GOPATH)/bin/actionlint"
          python workflow/tests/check_composite_actions.py --actionlint "$(go env GOPATH)/bin/actionlint"

      - name: Bash syntax check for workflow scripts
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "${script}"
          done < <(find workflow -type f -name "*.sh" | sort)

      - name: ShellCheck all tracked shell scripts
        run: |
          set -euo pipefail
          mapfile -d '' -t scripts < <(git ls-files -z '*.sh')
          scripts+=(dev)
          shellcheck -S warning -x \
            -e SC1091,SC2034,SC2154,SC2317 \
            "${scripts[@]}"

      - name: Ruff check all Python sources
        run: |
          python -m ruff check workflow container/scripts

      - name: Shell static safety checks
        run: |
          python -m pytest -q \
            --gg-suite static \
            --durations=25 \
            --durations-min=0.5 \
            workflow/tests

  r-script-parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Install R test dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          cache: always
          packages: any::sessioninfo
          extra-packages: |
            any::ggplot2
            any::ape
            kfuku52/rkftools@master

      - name: Parse-check workflow R scripts
        run: |
          Rscript workflow/tests/test_r_scripts_parse.R

      - name: Run lightweight R unit tests
        run: |
          Rscript workflow/tests/test_r_species_label_utils.R

  prepare-sif:
    needs:
      - runtime-change-filter
      - python-smoke
      - shell-static
    if: needs.runtime-change-filter.outputs.should_run == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      runtime-input: ${{ steps.sif.outputs.runtime-input }}
      cache-key: ${{ steps.sif.outputs.cache-key }}
      cache-hit: ${{ steps.sif.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare exact SIF once
        id: sif
        uses: ./.github/actions/validate-sif
        with:
          validation-suite: prepare
          prepared-runtime-input: ${{ github.event_name == 'workflow_dispatch' && inputs.cached_runtime_input || '' }}

      - name: Share uncached SIF with validation partitions
        if: steps.sif.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-sif
          path: genegalleon.sif
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  sif-python:
    needs: [prepare-sif]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate SIF Python partition
        uses: ./.github/actions/validate-sif
        with:
          prepared-runtime-input: ${{ needs.prepare-sif.outputs.runtime-input }}
          validation-suite: runtime-python
          shard: ${{ matrix.shard }}/8

  sif-other:
    needs: [prepare-sif]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [runtime-extra, r, 3di]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate independent SIF checks
        uses: ./.github/actions/validate-sif
        with:
          prepared-runtime-input: ${{ needs.prepare-sif.outputs.runtime-input }}
          validation-suite: ${{ matrix.suite }}

  sif-runtime-validation:
    needs: [prepare-sif, sif-python, sif-other]
    if: ${{ !cancelled() && needs.prepare-sif.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every SIF validation partition
        env:
          PREPARE_RESULT: ${{ needs.prepare-sif.result }}
          PYTHON_RESULT: ${{ needs.sif-python.result }}
          OTHER_RESULT: ${{ needs.sif-other.result }}
        run: |
          test "${PREPARE_RESULT}" = success
          test "${PYTHON_RESULT}" = success
          test "${OTHER_RESULT}" = success

      - name: Download newly validated SIF
        if: >-
          needs.prepare-sif.outputs.cache-hit != 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validation-sif
          path: .

      - name: Save validated SIF by exact runtime input
        if: >-
          needs.prepare-sif.outputs.cache-hit != 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: genegalleon.sif
          key: ${{ needs.prepare-sif.outputs.cache-key }}
