name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  runtime-change-filter:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}

    steps:
      - name: Checkout history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect container-runtime changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          should_run=0
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            should_run=1
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            should_run=1
          else
            while IFS= read -r path; do
              case "${path}" in
                .dockerignore|dev|pyproject.toml|gg_container_build_entrypoint.sh|container/*|workflow/*|.github/workflows/tests.yml|.github/actions/*)
                  should_run=1
                  break
                  ;;
              esac
            done < <(git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}")
          fi
          echo "should_run=${should_run}" >> "${GITHUB_OUTPUT}"

  python-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            workflow/tests/requirements-smoke.txt
            workflow/tests/requirements.lock.txt

      - name: Install test dependencies
        run: |
          python -m pip install \
            --constraint workflow/tests/requirements.lock.txt \
            --requirement workflow/tests/requirements-smoke.txt

      - name: Run smoke tests
        run: |
          python -m pytest -q -x \
            --gg-suite smoke \
            --durations=25 \
            --durations-min=0.5 \
            workflow/tests

  python-wheels:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve moving test dependency once
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source container/source_branches.env
          csubst_sha="$(bash container/scripts/resolve_git_branch_sha.sh https://github.com/kfuku52/csubst.git "${GG_SOURCE_CSUBST_REPO_REF}")"
          [[ "${csubst_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "csubst_sha=${csubst_sha}" >> "${GITHUB_OUTPUT}"

      - name: Restore test wheels by resolved source and constraints
        id: wheels-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gg-test-wheels
          key: test-wheels-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('workflow/tests/requirements.txt', 'workflow/tests/requirements.lock.txt', 'workflow/tests/prepare_test_wheels.py') }}-${{ steps.source.outputs.csubst_sha }}

      - name: Build missing test wheels
        if: steps.wheels-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          CSUBST_SHA: ${{ steps.source.outputs.csubst_sha }}
        run: |
          set -euo pipefail
          python workflow/tests/prepare_test_wheels.py \
            --directory "${RUNNER_TEMP}/gg-test-wheels" --csubst-sha "${CSUBST_SHA}"
          python -m pip wheel \
            --constraint workflow/tests/requirements.lock.txt \
            --requirement "${RUNNER_TEMP}/gg-test-wheels/build-requirements.txt" \
            --wheel-dir "${RUNNER_TEMP}/gg-test-wheels"

      - name: Save trusted test wheels
        if: >-
          steps.wheels-cache.outputs.cache-hit != 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gg-test-wheels
          key: ${{ steps.wheels-cache.outputs.cache-primary-key }}

      - name: Share exact wheels with parallel test lanes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-test-wheels
          path: ${{ runner.temp }}/gg-test-wheels
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  python-fast:
    needs: [python-smoke, python-wheels]
    name: python-fast (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download exact test wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-test-wheels
          path: ${{ runner.temp }}/gg-test-wheels

      - name: Install test dependencies
        run: |
          python -m pip install --no-index \
            --find-links "${RUNNER_TEMP}/gg-test-wheels" \
            --constraint workflow/tests/requirements.lock.txt \
            --requirement "${RUNNER_TEMP}/gg-test-wheels/install-requirements.txt"

      - name: Run fast Python tests
        run: |
          python -m pytest -q \
            -n 2 \
            --dist load \
            --gg-suite fast \
            --durations=25 \
            --durations-min=0.5 \
            workflow/tests

  python-heavy:
    needs: [python-smoke, python-wheels]
    name: python-heavy (${{ matrix.shard.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        shard:
          - name: download-and-traits
            suite: integration-download
          - name: workflow-integrations
            suite: integration-workflow

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download exact test wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-test-wheels
          path: ${{ runner.temp }}/gg-test-wheels

      - name: Install test dependencies
        run: |
          python -m pip install --no-index \
            --find-links "${RUNNER_TEMP}/gg-test-wheels" \
            --constraint workflow/tests/requirements.lock.txt \
            --requirement "${RUNNER_TEMP}/gg-test-wheels/install-requirements.txt"

      - name: Run heavy Python tests
        run: |
          python -m pytest -q \
            -n 2 \
            --dist load \
            --gg-suite "${{ matrix.shard.suite }}" \
            --durations=25 \
            --durations-min=0.5 \
            workflow/tests

  shell-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install minimal test dependency
        run: |
          python -m pip install \
            --constraint workflow/tests/requirements.lock.txt \
            pytest pyyaml ruff

      - name: Install shell and workflow linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate GitHub Actions workflows
        run: |
          "$(go env GOPATH)/bin/actionlint"
          python workflow/tests/check_composite_actions.py --actionlint "$(go env GOPATH)/bin/actionlint"

      - name: Bash syntax check for workflow scripts
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "${script}"
          done < <(find workflow -type f -name "*.sh" | sort)

      - name: ShellCheck all tracked shell scripts
        run: |
          set -euo pipefail
          mapfile -d '' -t scripts < <(git ls-files -z '*.sh')
          scripts+=(dev)
          shellcheck -S warning -x \
            -e SC1091,SC2034,SC2154,SC2317 \
            "${scripts[@]}"

      - name: Ruff check all Python sources
        run: |
          python -m ruff check workflow container/scripts

      - name: Shell static safety checks
        run: |
          python -m pytest -q \
            --gg-suite static \
            --durations=25 \
            --durations-min=0.5 \
            workflow/tests

  r-script-parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2

      - name: Install R test dependencies
        uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          cache: always
          packages: any::sessioninfo
          extra-packages: |
            any::ggplot2
            any::ape
            kfuku52/rkftools@master

      - name: Parse-check workflow R scripts
        run: |
          Rscript workflow/tests/test_r_scripts_parse.R

      - name: Run lightweight R unit tests
        run: |
          Rscript workflow/tests/test_pgls_common_rphylopars.R
          Rscript workflow/tests/test_r_species_label_utils.R

  sif-runtime-validation:
    needs:
      - runtime-change-filter
      - python-smoke
      - shell-static
    if: needs.runtime-change-filter.outputs.should_run == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate exact runtime and reuse the shared SIF cache
        uses: ./.github/actions/validate-sif
        with:
          # Temporary dependency-qualified runtime while Bioconda PR #68643
          # awaits merge. It contains the exact hook-free ASTER build verified
          # by the authoritative runtime suite; the checked-out source remains
          # mounted and tested by the composite action.
          image-ref: ghcr.io/kfuku52/genegalleon:20260901-2c1e5fd-1f6ad14c41e0
          runtime-input: 1f6ad14c41e03cc13d84e096c7672f54ac0d6698efd42198809e320d1d72f2fe
          security-refresh-epoch: "2026-08-31"
