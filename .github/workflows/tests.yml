name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: workflow/tests/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r workflow/tests/requirements.txt

      - name: Run smoke tests
        run: |
          python -m pytest -q -x \
            workflow/tests/test_busco_hmmsearch_wrapper.py \
            workflow/tests/test_gg_input_generation_end_to_end.py::test_gg_input_generation_single_mode_end_to_end

  python-fast:
    needs: python-smoke
    name: python-fast (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: workflow/tests/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r workflow/tests/requirements.txt

      - name: Run fast Python tests
        shell: bash
        run: |
          tests=()
          while IFS= read -r test_path; do
            tests+=("${test_path}")
          done < <(find workflow/tests -maxdepth 1 -type f -name "test_*.py" | sort)

          exclude=(
            "workflow/tests/test_busco_hmmsearch_wrapper.py"
            "workflow/tests/test_format_species_inputs_download_runtime.py"
            "workflow/tests/test_format_species_inputs_download.py"
            "workflow/tests/test_format_species_inputs_provider_pages.py"
            "workflow/tests/test_generate_species_trait.py"
            "workflow/tests/test_genome_evolution_protein_mode.py"
            "workflow/tests/test_gg_input_generation_end_to_end.py"
            "workflow/tests/test_hgt_end_to_end.py"
            "workflow/tests/test_shell_static_safety.py"
          )

          filtered=()
          for test_path in "${tests[@]}"; do
            skip=0
            for excluded in "${exclude[@]}"; do
              if [[ "${test_path}" == "${excluded}" ]]; then
                skip=1
                break
              fi
            done
            if [[ "${skip}" -eq 0 ]]; then
              filtered+=("${test_path}")
            fi
          done

          python -m pytest -q "${filtered[@]}"

  python-heavy:
    needs: python-smoke
    name: python-heavy (${{ matrix.shard.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        shard:
          - name: download-and-traits
            tests: >-
              workflow/tests/test_format_species_inputs_download.py
              workflow/tests/test_format_species_inputs_download_runtime.py
              workflow/tests/test_format_species_inputs_provider_pages.py
              workflow/tests/test_generate_species_trait.py
          - name: workflow-integrations
            tests: >-
              workflow/tests/test_busco_hmmsearch_wrapper.py
              workflow/tests/test_genome_evolution_protein_mode.py
              workflow/tests/test_gg_input_generation_end_to_end.py
              workflow/tests/test_hgt_end_to_end.py

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: workflow/tests/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r workflow/tests/requirements.txt

      - name: Run heavy Python tests
        run: |
          python -m pytest -q ${{ matrix.shard.tests }}

  shell-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install minimal test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml ruff

      - name: Install shell and workflow linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate GitHub Actions workflows
        run: |
          "$(go env GOPATH)/bin/actionlint"

      - name: Bash syntax check for workflow scripts
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "${script}"
          done < <(find workflow -type f -name "*.sh" | sort)

      - name: ShellCheck workflow drivers
        run: |
          shellcheck -S warning -x \
            -e SC1091,SC2034,SC2154,SC2317 \
            workflow/core/gg_gene_evolution_core.sh \
            workflow/core/gg_genome_evolution_core.sh \
            workflow/core/gg_transcriptome_generation_core.sh \
            workflow/support/gg_util.sh \
            workflow/support/gg_util/*.sh

      - name: Ruff check all Python sources
        run: |
          python -m ruff check workflow

      - name: Shell static safety checks
        run: |
          python -m pytest -q \
            workflow/tests/test_ci_static.py \
            workflow/tests/test_shell_download_static.py \
            workflow/tests/test_shell_static_safety.py \
            workflow/tests/test_shell_entrypoint_static.py \
            workflow/tests/test_shell_shared_lock_static.py \
            workflow/tests/test_shell_transcriptome_static.py

  r-script-parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Install R test dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          cache: always
          packages: any::sessioninfo
          extra-packages: |
            any::ggplot2
            any::ape

      - name: Parse-check workflow R scripts
        run: |
          Rscript workflow/tests/test_r_scripts_parse.R

      - name: Run lightweight R unit tests
        run: |
          Rscript workflow/tests/test_pgls_common_rphylopars.R
          Rscript workflow/tests/test_r_species_label_utils.R

  sif-runtime-validation:
    needs:
      - python-heavy
      - shell-static
      - r-script-parse
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reclaim runner disk space for SIF conversion
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk usage before cleanup:"
          df -h /
          sudo rm -rf -- \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/share/dotnet
          sudo apt-get clean
          docker system prune --all --force --volumes
          echo "Disk usage after cleanup:"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Expose GitHub runtime for BuildKit cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4

      - name: Build current GeneGalleon image
        shell: bash
        env:
          CACHE_FROM: type=gha,scope=container-linux-amd64
          CACHE_TO: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'type=gha,mode=max,scope=container-linux-amd64,ignore-error=true' || '' }}
        run: |
          BUILD_SIF=0 \
          IMAGE_SOURCE=local \
          IMAGE=local/genegalleon \
          TAG=ci \
          MODE=load \
          PLATFORMS=linux/amd64 \
          FORCE_LOAD_IN_CI=1 \
            bash ./gg_container_build_entrypoint.sh

      - name: Reclaim BuildKit cache before SIF conversion
        shell: bash
        run: |
          set -euo pipefail
          echo "Container storage before BuildKit cleanup:"
          docker system df
          docker buildx prune --all --force
          echo "Disk usage after BuildKit cleanup:"
          df -h /
          docker system df
          image_bytes="$(docker image inspect --format '{{.Size}}' local/genegalleon:ci)"
          reserve_bytes=$((6 * 1024 * 1024 * 1024))
          required_bytes=$((2 * image_bytes + reserve_bytes))
          available_bytes="$(df --output=avail -B1 "${RUNNER_TEMP}" | awk 'NR == 2 { print $1 }')"
          printf 'SIF disk preflight: image=%s required_free=%s available=%s bytes\n' \
            "${image_bytes}" "${required_bytes}" "${available_bytes}"
          if (( available_bytes < required_bytes )); then
            echo "::error::Insufficient disk space for SIF conversion: need ${required_bytes} bytes, have ${available_bytes} bytes."
            exit 1
          fi
          free -h

      - name: Install Singularity runtime
        id: runtime
        shell: bash
        env:
          SINGULARITY_CE_VERSION: "4.5.0"
          SINGULARITY_CE_DEB_SHA256: "85e6f7af5e7aad5b1bf28183ce333998bd37eb8f4769af352c47a5153f3373fb"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          deb_name="singularity-ce_${SINGULARITY_CE_VERSION}-noble_amd64.deb"
          deb_path="${RUNNER_TEMP}/${deb_name}"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 5 \
            --retry-all-errors \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "${deb_path}" \
            "https://github.com/sylabs/singularity/releases/download/v${SINGULARITY_CE_VERSION}/${deb_name}"
          printf '%s  %s\n' "${SINGULARITY_CE_DEB_SHA256}" "${deb_path}" \
            | sha256sum --check --strict
          sudo apt-get install -y "${deb_path}"
          if ! command -v singularity >/dev/null 2>&1; then
            echo "SingularityCE installation did not provide the singularity command."
            exit 1
          fi
          installed_version="$(singularity version)"
          expected_version="${SINGULARITY_CE_VERSION}-noble"
          if [[ "${installed_version}" != "${expected_version}" ]]; then
            echo "Expected SingularityCE ${expected_version}, found ${installed_version}."
            exit 1
          fi
          echo "SingularityCE ${installed_version}"
          echo "engine=singularity" >> "${GITHUB_OUTPUT}"

      - name: Build validation SIF from current image
        shell: bash
        env:
          APPTAINER_CACHEDIR: ${{ runner.temp }}/apptainer-cache
          APPTAINER_DISABLE_CACHE: "1"
          APPTAINER_TMPDIR: ${{ runner.temp }}/apptainer-tmp
          SINGULARITY_CACHEDIR: ${{ runner.temp }}/singularity-cache
          SINGULARITY_DISABLE_CACHE: "1"
          SINGULARITY_TMPDIR: ${{ runner.temp }}/singularity-tmp
          TMPDIR: ${{ runner.temp }}/singularity-transport-tmp
        run: |
          set -euo pipefail
          mkdir -p \
            "${APPTAINER_CACHEDIR}" \
            "${APPTAINER_TMPDIR}" \
            "${SINGULARITY_CACHEDIR}" \
            "${SINGULARITY_TMPDIR}" \
            "${TMPDIR}"
          echo "Disk usage before SIF conversion:"
          df -h /
          SOURCE=docker-daemon \
          IMAGE=local/genegalleon \
          TAG=ci \
          ENGINE="${{ steps.runtime.outputs.engine }}" \
          OUT="${GITHUB_WORKSPACE}/genegalleon.sif" \
            bash container/apptainer_from_docker.sh
          {
            echo "SIF validation image:"
            echo "- local/genegalleon:ci (built from ${GITHUB_SHA})"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report SIF conversion disk usage
        if: always()
        shell: bash
        run: |
          set -u
          df -h /
          free -h
          docker system df || true
          du -sh \
            "${RUNNER_TEMP}/apptainer-cache" \
            "${RUNNER_TEMP}/apptainer-tmp" \
            "${RUNNER_TEMP}/singularity-cache" \
            "${RUNNER_TEMP}/singularity-tmp" \
            "${RUNNER_TEMP}/singularity-transport-tmp" \
            2>/dev/null || true

      - name: Run SIF validation checks
        run: |
          bash workflow/tests/run_in_sif.sh python -m pytest -q workflow/tests/test_hgt_end_to_end.py
          bash workflow/tests/run_in_sif.sh python -m pytest -q workflow/tests/test_format_species_inputs_provider_pages.py::test_download_manifest_figshare_extracts_rar_member_from_extensionless_url
          bash workflow/tests/run_in_sif.sh bash workflow/tests/check_treevis_package.sh
          bash workflow/tests/run_in_sif.sh Rscript workflow/tests/test_orthogroup_copy_number_trait_pgls.R
          bash workflow/tests/run_in_sif.sh Rscript workflow/tests/test_treevis_main.R
