name: container-ghcr

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      decision_reason: ${{ steps.decision.outputs.decision_reason }}
      security_refresh_epoch: ${{ steps.decision.outputs.security_refresh_epoch }}
      image: ${{ steps.vars.outputs.image }}
      immutable_tag: ${{ steps.vars.outputs.immutable_tag }}
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
      build_date: ${{ steps.vars.outputs.build_date }}
      gg_version: ${{ steps.vars.outputs.gg_version }}
      build_input: ${{ steps.build-input.outputs.value }}
      runtime_input: ${{ steps.build-input.outputs.runtime_value }}
      amalgkit_repo_sha: ${{ steps.vars.outputs.amalgkit_repo_sha }}
      cdskit_repo_sha: ${{ steps.vars.outputs.cdskit_repo_sha }}
      csubst_repo_sha: ${{ steps.vars.outputs.csubst_repo_sha }}
      nwkit_repo_sha: ${{ steps.vars.outputs.nwkit_repo_sha }}
      busco_repo_sha: ${{ steps.vars.outputs.busco_repo_sha }}
      paml_repo_sha: ${{ steps.vars.outputs.paml_repo_sha }}
      iqtree_repo_sha: ${{ steps.vars.outputs.iqtree_repo_sha }}
      aster_repo_sha: ${{ steps.vars.outputs.aster_repo_sha }}
      locuskit_repo_sha: ${{ steps.vars.outputs.locuskit_repo_sha }}
      kftools_repo_sha: ${{ steps.vars.outputs.kftools_repo_sha }}
      rkftools_repo_sha: ${{ steps.vars.outputs.rkftools_repo_sha }}
      fastk_repo_sha: ${{ steps.vars.outputs.fastk_repo_sha }}
      rapidnj_repo_sha: ${{ steps.vars.outputs.rapidnj_repo_sha }}
      rapidnj_arm_repo_sha: ${{ steps.vars.outputs.rapidnj_arm_repo_sha }}
      smudgeplot_repo_sha: ${{ steps.vars.outputs.smudgeplot_repo_sha }}
      kmc_repo_sha: ${{ steps.vars.outputs.kmc_repo_sha }}
      genomescope_repo_sha: ${{ steps.vars.outputs.genomescope_repo_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python for smoke tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Smoke-test input generation refinement
        run: |
          python -m pip install --constraint workflow/tests/requirements.lock.txt pytest
          python workflow/tests/run_checks.py smoke workflow/tests/test_input_generation_refinement_finisher.py -x

      - name: Resolve moving source revisions
        shell: bash
        run: |
          set -euo pipefail
          if ! resolved_sources="$(bash container/scripts/resolve_source_revisions.sh --format env --scope all)"; then
            echo "Retrying upstream source resolution." >&2
            resolved_sources="$(bash container/scripts/resolve_source_revisions.sh --format env --scope all)"
          fi
          printf '%s\n' "${resolved_sources}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        if: github.event_name == 'schedule'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: github.event_name == 'schedule'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether a scheduled build is needed
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          security_refresh_epoch="$(date -u +%F)"
          echo "security_refresh_epoch=${security_refresh_epoch}" >> "${GITHUB_OUTPUT}"

          decide() {
            local should_build="$1"
            local reason="$2"
            local action="skip"
            if [[ "${should_build}" == "1" ]]; then
              action="run"
            fi
            {
              echo "should_build=${should_build}"
              echo "decision_reason=${reason}"
            } >> "${GITHUB_OUTPUT}"
            {
              echo "Scheduled publish preflight:"
              echo
              echo "- Build decision: ${action}"
              echo "- Reason: ${reason}"
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            decide 1 "manual dispatch"
            exit 0
          fi

          image="ghcr.io/$(printf '%s' "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          if ! published_images="$(
            docker buildx imagetools inspect --format '{{json .Image}}' "${image}:latest" 2>/dev/null
          )"; then
            decide 1 "published latest image metadata is unavailable"
            exit 0
          fi
          if ! published_revision="$(
            printf '%s\n' "${published_images}" | python container/scripts/check_published_build_input.py \
              --print-common-revision linux/amd64 \
              --print-common-revision linux/arm64
          )"; then
            decide 1 "published latest image revision metadata is missing or inconsistent"
            exit 0
          fi

          gg_version="$(sed -n '1p' VERSION | tr -d '\r')"
          if ! expected_hash="$(
            GG_BUILD_VCS_REF="${published_revision}" \
            GG_BUILD_VERSION="${gg_version}" \
              bash container/scripts/compute_build_input_hash.sh "${security_refresh_epoch}"
          )"; then
            decide 1 "build-input hash calculation failed during preflight"
            exit 0
          fi

          if printf '%s\n' "${published_images}" | python container/scripts/check_published_build_input.py \
              --expected "linux/amd64=${expected_hash}" \
              --expected "linux/arm64=${expected_hash}"; then
            decide 0 "repository and resolved upstream build inputs match the published image"
          else
            decide 1 "repository or resolved upstream build inputs differ from the published image"
          fi

      - name: Preflight env coverage check
        if: steps.decision.outputs.should_build == '1'
        shell: bash
        run: |
          set -euo pipefail
          container/scripts/check_env_coverage.sh .

      - name: Resolve image tags
        if: steps.decision.outputs.should_build == '1'
        id: vars
        env:
          SECURITY_REFRESH_EPOCH: ${{ steps.decision.outputs.security_refresh_epoch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${SECURITY_REFRESH_EPOCH}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid security refresh epoch: ${SECURITY_REFRESH_EPOCH}"
            exit 1
          fi
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo_name="$(basename "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${repo_name}"
          date_tag="$(date -u +%Y%m%d)"
          short_sha="${GITHUB_SHA::7}"
          build_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          gg_version="$(sed -n '1p' VERSION | tr -d '\r')"

          amalgkit_repo_sha="${KFU52_AMALGKIT_REPO_SHA}"
          cdskit_repo_sha="${KFU52_CDSKIT_REPO_SHA}"
          csubst_repo_sha="${KFU52_CSUBST_REPO_SHA}"
          nwkit_repo_sha="${KFU52_NWKIT_REPO_SHA}"
          busco_repo_sha="${BUSCO_REPO_SHA}"
          paml_repo_sha="${PAML_REPO_SHA}"
          iqtree_repo_sha="${IQTREE_REPO_SHA}"
          aster_repo_sha="${ASTER_REPO_SHA}"
          locuskit_repo_sha="${LOCUSKIT_REPO_SHA}"
          kftools_repo_sha="${KFTOOLS_REPO_SHA}"
          rkftools_repo_sha="${RKFTOOLS_REPO_SHA}"
          fastk_repo_sha="${FASTK_REPO_SHA}"
          rapidnj_repo_sha="${RAPIDNJ_REPO_SHA}"
          rapidnj_arm_repo_sha="${RAPIDNJ_ARM_REPO_SHA}"
          smudgeplot_repo_sha="${SMUDGEPLOT_REPO_SHA}"
          kmc_repo_sha="${KMC_REPO_SHA}"
          genomescope_repo_sha="${GENOMESCOPE_REPO_SHA}"
          source_revision_hash="$(
            printf '%s\n' \
              "${amalgkit_repo_sha}" \
              "${cdskit_repo_sha}" \
              "${csubst_repo_sha}" \
              "${nwkit_repo_sha}" \
              "${busco_repo_sha}" \
              "${paml_repo_sha}" \
              "${iqtree_repo_sha}" \
              "${aster_repo_sha}" \
              "${locuskit_repo_sha}" \
              "${kftools_repo_sha}" \
              "${rkftools_repo_sha}" \
              "${fastk_repo_sha}" \
              "${rapidnj_repo_sha}" \
              "${rapidnj_arm_repo_sha}" \
              "${smudgeplot_repo_sha}" \
              "${kmc_repo_sha}" \
              "${genomescope_repo_sha}" \
              | sha256sum | cut -c1-12
          )"
          immutable_tag="${date_tag}-${short_sha}-${source_revision_hash}"

          {
            echo "image=${image}"
            echo "immutable_tag=${immutable_tag}"
            echo "sha_tag=sha-${short_sha}"
            echo "build_date=${build_date}"
            echo "gg_version=${gg_version}"
            echo "amalgkit_repo_sha=${amalgkit_repo_sha}"
            echo "cdskit_repo_sha=${cdskit_repo_sha}"
            echo "csubst_repo_sha=${csubst_repo_sha}"
            echo "nwkit_repo_sha=${nwkit_repo_sha}"
            echo "busco_repo_sha=${busco_repo_sha}"
            echo "paml_repo_sha=${paml_repo_sha}"
            echo "iqtree_repo_sha=${iqtree_repo_sha}"
            echo "aster_repo_sha=${aster_repo_sha}"
            echo "locuskit_repo_sha=${locuskit_repo_sha}"
            echo "kftools_repo_sha=${kftools_repo_sha}"
            echo "rkftools_repo_sha=${rkftools_repo_sha}"
            echo "fastk_repo_sha=${fastk_repo_sha}"
            echo "rapidnj_repo_sha=${rapidnj_repo_sha}"
            echo "rapidnj_arm_repo_sha=${rapidnj_arm_repo_sha}"
            echo "smudgeplot_repo_sha=${smudgeplot_repo_sha}"
            echo "kmc_repo_sha=${kmc_repo_sha}"
            echo "genomescope_repo_sha=${genomescope_repo_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Compute build input hash
        if: steps.decision.outputs.should_build == '1'
        id: build-input
        shell: bash
        env:
          GG_BUILD_VCS_REF: ${{ github.sha }}
          GG_BUILD_VERSION: ${{ steps.vars.outputs.gg_version }}
          GG_BUILD_SECURITY_REFRESH_EPOCH: ${{ steps.decision.outputs.security_refresh_epoch }}
        run: |
          set -euo pipefail
          build_input_hash="$(bash container/scripts/compute_build_input_hash.sh "${GG_BUILD_SECURITY_REFRESH_EPOCH}")"
          runtime_input_hash="$(bash container/scripts/compute_build_input_hash.sh --runtime "${GG_BUILD_SECURITY_REFRESH_EPOCH}")"
          if [[ ! "${build_input_hash}" =~ ^[0-9a-f]{64}$ || ! "${runtime_input_hash}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Build input hash calculation returned an invalid digest." >&2
            exit 1
          fi
          printf 'value=%s\nruntime_value=%s\n' \
            "${build_input_hash}" "${runtime_input_hash}" >> "${GITHUB_OUTPUT}"

  build-and-push:
    needs: prepare-build
    if: needs.prepare-build.outputs.should_build == '1'
    name: build-and-push (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    outputs:
      amd64_digest: ${{ steps.digest.outputs.amd64_digest }}
      arm64_digest: ${{ steps.digest.outputs.arm64_digest }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix: &platforms
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            digest_output: amd64_digest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            digest_output: arm64_digest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve platform
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          echo "pair=${platform//\//-}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: container/Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          outputs: >-
            type=image,name=${{ needs.prepare-build.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_TARGET=runtime
            BUILD_DATE=${{ needs.prepare-build.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            GG_VERSION=${{ needs.prepare-build.outputs.gg_version }}
            BUILD_INPUT_HASH=${{ needs.prepare-build.outputs.build_input }}
            RUNTIME_INPUT_HASH=${{ needs.prepare-build.outputs.runtime_input }}
            SECURITY_REFRESH_EPOCH=${{ needs.prepare-build.outputs.security_refresh_epoch }}
            KFU52_REPO_REF=master
            KFU52_AMALGKIT_REPO_REF=master
            KFU52_AMALGKIT_REPO_SHA=${{ needs.prepare-build.outputs.amalgkit_repo_sha }}
            KFU52_CDSKIT_REPO_REF=master
            KFU52_CDSKIT_REPO_SHA=${{ needs.prepare-build.outputs.cdskit_repo_sha }}
            KFU52_CSUBST_REPO_REF=master
            KFU52_CSUBST_REPO_SHA=${{ needs.prepare-build.outputs.csubst_repo_sha }}
            KFU52_NWKIT_REPO_REF=master
            KFU52_NWKIT_REPO_SHA=${{ needs.prepare-build.outputs.nwkit_repo_sha }}
            BUSCO_REPO_REF=master
            BUSCO_REPO_SHA=${{ needs.prepare-build.outputs.busco_repo_sha }}
            PAML_REPO_REF=master
            IQTREE_REPO_REF=master
            PAML_REPO_SHA=${{ needs.prepare-build.outputs.paml_repo_sha }}
            IQTREE_REPO_SHA=${{ needs.prepare-build.outputs.iqtree_repo_sha }}
            ASTER_REPO_SHA=${{ needs.prepare-build.outputs.aster_repo_sha }}
            LOCUSKIT_REPO_REF=main
            LOCUSKIT_REPO_SHA=${{ needs.prepare-build.outputs.locuskit_repo_sha }}
            KFTOOLS_REPO_SHA=${{ needs.prepare-build.outputs.kftools_repo_sha }}
            RKFTOOLS_REPO_SHA=${{ needs.prepare-build.outputs.rkftools_repo_sha }}
            FASTK_REPO_SHA=${{ needs.prepare-build.outputs.fastk_repo_sha }}
            RAPIDNJ_REPO_SHA=${{ needs.prepare-build.outputs.rapidnj_repo_sha }}
            RAPIDNJ_ARM_REPO_SHA=${{ needs.prepare-build.outputs.rapidnj_arm_repo_sha }}
            SMUDGEPLOT_REPO_SHA=${{ needs.prepare-build.outputs.smudgeplot_repo_sha }}
            KMC_REPO_SHA=${{ needs.prepare-build.outputs.kmc_repo_sha }}
            GENOMESCOPE_REPO_SHA=${{ needs.prepare-build.outputs.genomescope_repo_sha }}
          cache-from: |
            type=registry,ref=${{ needs.prepare-build.outputs.image }}:latest
            type=gha,scope=container-${{ steps.platform.outputs.pair }}
          # Ship the cache metadata with the image layers already being pushed.
          cache-to: type=inline

      - name: Export platform digest
        id: digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_OUTPUT: ${{ matrix.digest_output }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "docker/build-push-action did not return a valid image digest."
            exit 1
          fi
          printf '%s=%s\n' "${DIGEST_OUTPUT}" "${DIGEST}" >> "${GITHUB_OUTPUT}"

  validate-platform:
    needs: [prepare-build, build-and-push]
    name: validate-platform (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      # Keep the other platform's result for a failed-job rerun.
      fail-fast: false
      matrix: *platforms

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate repository-owned runtime contracts
        shell: bash
        env:
          IMAGE: ${{ needs.prepare-build.outputs.image }}
          PLATFORM: ${{ matrix.platform }}
          DIGEST: ${{ needs.build-and-push.outputs[matrix.digest_output] }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Expected a valid digest for ${PLATFORM}."
            exit 1
          fi
          docker run --rm --platform "${PLATFORM}" \
            --env PYTHONDONTWRITEBYTECODE=1 \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            "${IMAGE}@${DIGEST}" \
            python workflow/tests/run_checks.py runtime --workers=4 -x --durations=25 --durations-min=0.5

  publish-manifest:
    needs:
      - prepare-build
      - build-and-push
      - validate-platform
    if: |
      needs.prepare-build.result == 'success' &&
      needs.validate-platform.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        shell: bash
        env:
          IMAGE: ${{ needs.prepare-build.outputs.image }}
          IMMUTABLE_TAG: ${{ needs.prepare-build.outputs.immutable_tag }}
          SHA_TAG: ${{ needs.prepare-build.outputs.sha_tag }}
          AMD64_DIGEST: ${{ needs.build-and-push.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ needs.build-and-push.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          if [[ ! "${AMD64_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ || \
                ! "${ARM64_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ || \
                "${AMD64_DIGEST}" == "${ARM64_DIGEST}" ]]; then
            echo "Expected two distinct platform digests."
            exit 1
          fi

          # Keep the manifest order stable for existing immutable tags.
          mapfile -t refs < <(printf '%s\n' "${IMAGE}@${AMD64_DIGEST}" "${IMAGE}@${ARM64_DIGEST}" | sort)

          immutable_exists=0
          if existing_manifest="$(docker buildx imagetools inspect --raw "${IMAGE}:${IMMUTABLE_TAG}" 2>/dev/null)"; then
            immutable_exists=1
            planned_manifest="$(docker buildx imagetools create --dry-run --progress=none "${refs[@]}")"
            planned_fingerprint="$(
              jq -S -c '{schemaVersion, mediaType, manifests}' <<< "${planned_manifest}" | sha256sum | cut -d' ' -f1
            )"
            existing_fingerprint="$(
              jq -S -c '{schemaVersion, mediaType, manifests}' <<< "${existing_manifest}" | sha256sum | cut -d' ' -f1
            )"
            if [[ "${planned_fingerprint}" != "${existing_fingerprint}" ]]; then
              echo "Refusing to overwrite immutable image tag with different content: ${IMAGE}:${IMMUTABLE_TAG}"
              exit 1
            fi
            echo "Immutable image tag already matches the planned manifest; reusing it."
          fi

          manifest_tags=(
            --tag "${IMAGE}:${SHA_TAG}"
            --tag "${IMAGE}:latest"
          )
          if [[ "${immutable_exists}" == "0" ]]; then
            manifest_tags+=(--tag "${IMAGE}:${IMMUTABLE_TAG}")
          fi
          docker buildx imagetools create "${manifest_tags[@]}" "${refs[@]}"

      - name: Summary
        shell: bash
        env:
          DECISION_REASON: ${{ needs.prepare-build.outputs.decision_reason }}
        run: |
          set -euo pipefail
          {
            echo "Build trigger:"
            echo "- ${DECISION_REASON}"
            echo ""
            echo "Pushed image tags:"
            echo "- ${{ needs.prepare-build.outputs.image }}:${{ needs.prepare-build.outputs.immutable_tag }}"
            echo "- ${{ needs.prepare-build.outputs.image }}:${{ needs.prepare-build.outputs.sha_tag }}"
            echo "- ${{ needs.prepare-build.outputs.image }}:latest"
            echo ""
            echo "Platforms:"
            echo "- linux/amd64"
            echo "- linux/arm64"
            echo ""
            echo "Ubuntu security refresh epoch: ${{ needs.prepare-build.outputs.security_refresh_epoch }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  prime-sif-cache:
    needs:
      - prepare-build
      - publish-manifest
    if: needs.publish-manifest.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare validated SIF for subsequent commit checks
        uses: ./.github/actions/validate-sif
        with:
          image-ref: ${{ needs.prepare-build.outputs.image }}:${{ needs.prepare-build.outputs.immutable_tag }}
          runtime-input: ${{ needs.prepare-build.outputs.runtime_input }}
          security-refresh-epoch: ${{ needs.prepare-build.outputs.security_refresh_epoch }}
          workers: "4"
