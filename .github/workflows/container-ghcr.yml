name: container-ghcr

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-trigger:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      decision_reason: ${{ steps.decision.outputs.decision_reason }}
      matched_sha: ${{ steps.decision.outputs.matched_sha }}
      matched_files: ${{ steps.decision.outputs.matched_files }}
    steps:
      - name: Decide whether a scheduled build is needed
        id: decision
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, time, timedelta, timezone
          from zoneinfo import ZoneInfo

          owner, repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          default_branch = os.environ["DEFAULT_BRANCH"]
          event_name = os.environ["EVENT_NAME"]
          output_path = os.environ["GITHUB_OUTPUT"]
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          token = os.environ["GITHUB_TOKEN"]

          def set_output(key: str, value: str) -> None:
              with open(output_path, "a", encoding="utf-8") as fh:
                  fh.write(f"{key}={value}\n")

          def append_summary(lines: list[str]) -> None:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")

          def github_api(path: str, params: dict[str, str] | None = None):
              url = f"https://api.github.com{path}"
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "genegalleon-container-ghcr",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          if event_name == "workflow_dispatch":
              set_output("should_build", "1")
              set_output("decision_reason", "manual dispatch")
              set_output("matched_sha", "manual")
              set_output("matched_files", "manual dispatch")
              append_summary(
                  [
                      "Manual dispatch requested.",
                      "",
                      "- Build decision: run",
                      "- Reason: workflow_dispatch bypasses the scheduled-change filter",
                  ]
              )
              raise SystemExit(0)

          now_jst = datetime.now(ZoneInfo("Asia/Tokyo"))
          today_jst = now_jst.date()
          start_jst = datetime.combine(
              today_jst - timedelta(days=1),
              time.min,
              tzinfo=ZoneInfo("Asia/Tokyo"),
          )
          end_jst = datetime.combine(
              today_jst,
              time.min,
              tzinfo=ZoneInfo("Asia/Tokyo"),
          )
          start_utc = start_jst.astimezone(timezone.utc).replace(microsecond=0)
          end_utc = end_jst.astimezone(timezone.utc).replace(microsecond=0)
          since = start_utc.isoformat().replace("+00:00", "Z")
          until = end_utc.isoformat().replace("+00:00", "Z")

          watched_paths = {
              ".dockerignore",
              ".github/workflows/container-ghcr.yml",
          }
          watched_prefixes = ("container/", "workflow/support/treevis/")

          page = 1
          commit_count = 0
          matched_sha = ""
          matched_files: list[str] = []

          while True:
              commits = github_api(
                  f"/repos/{owner}/{repo}/commits",
                  {
                      "sha": default_branch,
                      "since": since,
                      "until": until,
                      "per_page": "100",
                      "page": str(page),
                  },
              )
              if not commits:
                  break

              commit_count += len(commits)
              for commit in commits:
                  sha = commit["sha"]
                  details = github_api(f"/repos/{owner}/{repo}/commits/{sha}")
                  files = [item["filename"] for item in details.get("files", [])]
                  matched = sorted(
                      {
                          path
                          for path in files
                          if path in watched_paths
                          or any(path.startswith(prefix) for prefix in watched_prefixes)
                      }
                  )
                  if matched:
                      matched_sha = sha[:7]
                      matched_files = matched
                      break

              if matched_sha or len(commits) < 100:
                  break
              page += 1

          if not matched_sha:
              upstream_repositories = (
                  "amalgkit",
                  "cdskit",
                  "csubst",
                  "nwkit",
                  "kfl1ou",
                  "kftools",
                  "rkftools",
                  "RADTE",
              )
              for upstream_repo in upstream_repositories:
                  upstream_commits = github_api(
                      f"/repos/kfuku52/{upstream_repo}/commits",
                      {
                          "sha": "master",
                          "since": since,
                          "until": until,
                          "per_page": "1",
                      },
                  )
                  if upstream_commits:
                      matched_sha = upstream_commits[0]["sha"][:7]
                      matched_files = [f"kfuku52/{upstream_repo}@master"]
                      break

          if matched_sha:
              if matched_files and matched_files[0].startswith("kfuku52/"):
                  reason = "a tracked kfuku52 master branch changed on the previous JST day"
              else:
                  reason = "container-related changes found on the previous JST day"
              set_output("should_build", "1")
              set_output("decision_reason", reason)
              set_output("matched_sha", matched_sha)
              set_output("matched_files", ",".join(matched_files))
              append_summary(
                  [
                      "Scheduled publish preflight:",
                      "",
                      "- Build decision: run",
                      f"- JST window: {start_jst.isoformat()} to {end_jst.isoformat()}",
                      f"- Matching commit: `{matched_sha}`",
                      f"- Matching paths: {', '.join(matched_files)}",
                  ]
              )
          else:
              reason = "no container-related changes found on the previous JST day"
              set_output("should_build", "0")
              set_output("decision_reason", reason)
              set_output("matched_sha", "none")
              set_output("matched_files", "none")
              append_summary(
                  [
                      "Scheduled publish preflight:",
                      "",
                      "- Build decision: skip",
                      f"- JST window: {start_jst.isoformat()} to {end_jst.isoformat()}",
                      f"- Commits inspected on `{default_branch}`: {commit_count}",
                      "- Matching paths: none",
                  ]
              )
          PY

  prepare-build:
    needs: check-trigger
    if: |
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.check-trigger.outputs.should_build == '1'
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.vars.outputs.image }}
      immutable_tag: ${{ steps.vars.outputs.immutable_tag }}
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
      build_date: ${{ steps.vars.outputs.build_date }}
      amalgkit_repo_sha: ${{ steps.vars.outputs.amalgkit_repo_sha }}
      cdskit_repo_sha: ${{ steps.vars.outputs.cdskit_repo_sha }}
      csubst_repo_sha: ${{ steps.vars.outputs.csubst_repo_sha }}
      nwkit_repo_sha: ${{ steps.vars.outputs.nwkit_repo_sha }}
      kfl1ou_repo_sha: ${{ steps.vars.outputs.kfl1ou_repo_sha }}
      kftools_repo_sha: ${{ steps.vars.outputs.kftools_repo_sha }}
      rkftools_repo_sha: ${{ steps.vars.outputs.rkftools_repo_sha }}
      radte_repo_sha: ${{ steps.vars.outputs.radte_repo_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preflight env coverage check
        shell: bash
        run: |
          set -euo pipefail
          container/scripts/check_env_coverage.sh .

      - name: Resolve image tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo_name="$(basename "${GITHUB_REPOSITORY}")"
          image="ghcr.io/${owner}/${repo_name}"
          date_tag="$(date -u +%Y%m%d)"
          short_sha="${GITHUB_SHA::7}"
          build_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          resolve_source_sha() {
            bash container/scripts/resolve_git_branch_sha.sh \
              "https://github.com/kfuku52/$1.git" master
          }

          amalgkit_repo_sha="$(resolve_source_sha amalgkit)"
          cdskit_repo_sha="$(resolve_source_sha cdskit)"
          csubst_repo_sha="$(resolve_source_sha csubst)"
          nwkit_repo_sha="$(resolve_source_sha nwkit)"
          kfl1ou_repo_sha="$(resolve_source_sha kfl1ou)"
          kftools_repo_sha="$(resolve_source_sha kftools)"
          rkftools_repo_sha="$(resolve_source_sha rkftools)"
          radte_repo_sha="$(resolve_source_sha RADTE)"
          source_revision_hash="$(
            printf '%s\n' \
              "${amalgkit_repo_sha}" \
              "${cdskit_repo_sha}" \
              "${csubst_repo_sha}" \
              "${nwkit_repo_sha}" \
              "${kfl1ou_repo_sha}" \
              "${kftools_repo_sha}" \
              "${rkftools_repo_sha}" \
              "${radte_repo_sha}" \
              | sha256sum | cut -c1-12
          )"
          immutable_tag="${date_tag}-${short_sha}-${source_revision_hash}"

          {
            echo "image=${image}"
            echo "immutable_tag=${immutable_tag}"
            echo "sha_tag=sha-${short_sha}"
            echo "build_date=${build_date}"
            echo "amalgkit_repo_sha=${amalgkit_repo_sha}"
            echo "cdskit_repo_sha=${cdskit_repo_sha}"
            echo "csubst_repo_sha=${csubst_repo_sha}"
            echo "nwkit_repo_sha=${nwkit_repo_sha}"
            echo "kfl1ou_repo_sha=${kfl1ou_repo_sha}"
            echo "kftools_repo_sha=${kftools_repo_sha}"
            echo "rkftools_repo_sha=${rkftools_repo_sha}"
            echo "radte_repo_sha=${radte_repo_sha}"
          } >> "${GITHUB_OUTPUT}"

  build-and-push:
    needs: prepare-build
    if: needs.prepare-build.result == 'success'
    name: build-and-push (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve platform
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          echo "pair=${platform//\//-}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: container/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: >-
            type=image,name=${{ needs.prepare-build.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ needs.prepare-build.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            KFU52_REPO_REF=master
            KFU52_AMALGKIT_REPO_REF=master
            KFU52_AMALGKIT_REPO_SHA=${{ needs.prepare-build.outputs.amalgkit_repo_sha }}
            KFU52_CDSKIT_REPO_SHA=${{ needs.prepare-build.outputs.cdskit_repo_sha }}
            KFU52_CSUBST_REPO_REF=master
            KFU52_CSUBST_REPO_SHA=${{ needs.prepare-build.outputs.csubst_repo_sha }}
            KFU52_NWKIT_REPO_SHA=${{ needs.prepare-build.outputs.nwkit_repo_sha }}
            KFL1OU_REPO_SHA=${{ needs.prepare-build.outputs.kfl1ou_repo_sha }}
            KFTOOLS_REPO_SHA=${{ needs.prepare-build.outputs.kftools_repo_sha }}
            RKFTOOLS_REPO_SHA=${{ needs.prepare-build.outputs.rkftools_repo_sha }}
            RADTE_REPO_SHA=${{ needs.prepare-build.outputs.radte_repo_sha }}
          cache-from: type=gha,scope=container-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=container-${{ steps.platform.outputs.pair }}

      - name: Validate current csubst scan runtime and database import
        shell: bash
        env:
          IMAGE: ${{ needs.prepare-build.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" ]]; then
            echo "docker/build-push-action did not return an image digest."
            exit 1
          fi
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            "${IMAGE}@${DIGEST}" \
            python -m pytest -q workflow/tests/test_csubst_scan_runtime_integration.py

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if [[ -z "${digest}" ]]; then
            echo "docker/build-push-action did not return an image digest."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    needs:
      - check-trigger
      - prepare-build
      - build-and-push
    if: |
      needs.prepare-build.result == 'success' &&
      needs.build-and-push.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        shell: bash
        env:
          IMAGE: ${{ needs.prepare-build.outputs.image }}
          IMMUTABLE_TAG: ${{ needs.prepare-build.outputs.immutable_tag }}
          SHA_TAG: ${{ needs.prepare-build.outputs.sha_tag }}
        run: |
          set -euo pipefail
          mapfile -t digests < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#digests[@]}."
            exit 1
          fi

          refs=()
          for digest in "${digests[@]}"; do
            refs+=("${IMAGE}@sha256:${digest}")
          done

          immutable_exists=0
          if existing_manifest="$(docker buildx imagetools inspect --raw "${IMAGE}:${IMMUTABLE_TAG}" 2>/dev/null)"; then
            immutable_exists=1
            planned_manifest="$(docker buildx imagetools create --dry-run --progress=none "${refs[@]}")"
            planned_fingerprint="$(
              jq -S -c '{schemaVersion, mediaType, manifests}' <<< "${planned_manifest}" | sha256sum | cut -d' ' -f1
            )"
            existing_fingerprint="$(
              jq -S -c '{schemaVersion, mediaType, manifests}' <<< "${existing_manifest}" | sha256sum | cut -d' ' -f1
            )"
            if [[ "${planned_fingerprint}" != "${existing_fingerprint}" ]]; then
              echo "Refusing to overwrite immutable image tag with different content: ${IMAGE}:${IMMUTABLE_TAG}"
              exit 1
            fi
            echo "Immutable image tag already matches the planned manifest; reusing it."
          fi

          manifest_tags=(
            --tag "${IMAGE}:${SHA_TAG}"
            --tag "${IMAGE}:latest"
          )
          if [[ "${immutable_exists}" == "0" ]]; then
            manifest_tags+=(--tag "${IMAGE}:${IMMUTABLE_TAG}")
          fi
          docker buildx imagetools create "${manifest_tags[@]}" "${refs[@]}"

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Build trigger:"
            echo "- ${{ needs.check-trigger.outputs.decision_reason }}"
            echo "- matched commit: ${{ needs.check-trigger.outputs.matched_sha }}"
            echo "- matched paths: ${{ needs.check-trigger.outputs.matched_files }}"
            echo ""
            echo "Pushed image tags:"
            echo "- ${{ needs.prepare-build.outputs.image }}:${{ needs.prepare-build.outputs.immutable_tag }}"
            echo "- ${{ needs.prepare-build.outputs.image }}:${{ needs.prepare-build.outputs.sha_tag }}"
            echo "- ${{ needs.prepare-build.outputs.image }}:latest"
            echo ""
            echo "Platforms:"
            echo "- linux/amd64"
            echo "- linux/arm64"
          } >> "${GITHUB_STEP_SUMMARY}"
