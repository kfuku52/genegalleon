name: container-ghcr

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: container-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-trigger:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      decision_reason: ${{ steps.decision.outputs.decision_reason }}
      baseline_sha: ${{ steps.decision.outputs.baseline_sha }}
      matched_files: ${{ steps.decision.outputs.matched_files }}
    steps:
      - name: Decide whether a scheduled build is needed
        id: decision
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          owner, repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          default_branch = os.environ["DEFAULT_BRANCH"]
          event_name = os.environ["EVENT_NAME"]
          output_path = os.environ["GITHUB_OUTPUT"]
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          token = os.environ["GITHUB_TOKEN"]

          def set_output(key: str, value: str) -> None:
              with open(output_path, "a", encoding="utf-8") as fh:
                  fh.write(f"{key}={value}\n")

          def append_summary(lines: list[str]) -> None:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")

          def github_api(path: str, params: dict[str, str] | None = None):
              url = f"https://api.github.com{path}"
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "genegalleon-container-ghcr",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          if event_name == "workflow_dispatch":
              set_output("should_build", "1")
              set_output("decision_reason", "manual dispatch")
              set_output("baseline_sha", "manual")
              set_output("matched_files", "manual dispatch")
              append_summary(
                  [
                      "Manual dispatch requested.",
                      "",
                      "- Build decision: run",
                      "- Reason: workflow_dispatch bypasses the scheduled-change filter",
                  ]
              )
              raise SystemExit(0)

          watched_paths = {
              ".dockerignore",
              ".github/workflows/container-ghcr.yml",
              "VERSION",
          }
          watched_prefixes = ("container/", "workflow/support/treevis/")

          def decide(should_build: bool, reason: str, baseline: str, files: list[str]) -> None:
              set_output("should_build", "1" if should_build else "0")
              set_output("decision_reason", reason)
              set_output("baseline_sha", baseline[:7] if baseline else "none")
              set_output("matched_files", ",".join(files) if files else "none")
              append_summary(
                  [
                      "Scheduled publish preflight:",
                      "",
                      f"- Build decision: {'run' if should_build else 'skip'}",
                      f"- Baseline: `{baseline[:7]}`" if baseline else "- Baseline: none",
                      f"- Reason: {reason}",
                      f"- Matching paths: {', '.join(files)}" if files else "- Matching paths: none",
                  ]
              )

          try:
              runs = github_api(
                  f"/repos/{owner}/{repo}/actions/workflows/container-ghcr.yml/runs",
                  {
                      "branch": default_branch,
                      "status": "success",
                      "per_page": "20",
                  },
              ).get("workflow_runs", [])
              baseline = next(
                  (run["head_sha"] for run in runs if run.get("head_sha")),
                  "",
              )
              if not baseline:
                  decide(True, "no previous successful publish run was found", "", [])
                  raise SystemExit(0)

              comparison = github_api(
                  f"/repos/{owner}/{repo}/compare/{baseline}...{os.environ['GITHUB_SHA']}"
              )
              if comparison.get("status") not in {"ahead", "identical"}:
                  decide(True, "the successful baseline is not an ancestor of the current revision", baseline, [])
                  raise SystemExit(0)
              if comparison.get("total_commits", 0) > 250:
                  decide(True, "the comparison is too large to inspect safely", baseline, [])
                  raise SystemExit(0)

              changed_files = [item["filename"] for item in comparison.get("files", [])]
              matched_files = sorted(
                  path
                  for path in changed_files
                  if path in watched_paths
                  or any(path.startswith(prefix) for prefix in watched_prefixes)
              )
              if matched_files:
                  decide(True, "container inputs changed since the last successful publish", baseline, matched_files)
              else:
                  decide(False, "container inputs are unchanged since the last successful publish", baseline, [])
          except SystemExit:
              raise
          except Exception as exc:
              # A transient API or comparison failure must not permanently hide a build.
              decide(True, f"preflight failed conservatively: {type(exc).__name__}: {exc}", "", [])
          PY

  prepare-build:
    needs: check-trigger
    if: |
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.check-trigger.outputs.should_build == '1'
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.vars.outputs.image }}
      immutable_tag: ${{ steps.vars.outputs.immutable_tag }}
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
      build_date: ${{ steps.vars.outputs.build_date }}
      gg_version: ${{ steps.vars.outputs.gg_version }}
      amalgkit_repo_sha: ${{ steps.vars.outputs.amalgkit_repo_sha }}
      cdskit_repo_sha: ${{ steps.vars.outputs.cdskit_repo_sha }}
      csubst_repo_sha: ${{ steps.vars.outputs.csubst_repo_sha }}
      nwkit_repo_sha: ${{ steps.vars.outputs.nwkit_repo_sha }}
      busco_repo_sha: ${{ steps.vars.outputs.busco_repo_sha }}
      paml_repo_sha: ${{ steps.vars.outputs.paml_repo_sha }}
      kfl1ou_repo_sha: ${{ steps.vars.outputs.kfl1ou_repo_sha }}
      kffractbias_repo_sha: ${{ steps.vars.outputs.kffractbias_repo_sha }}
      kftools_repo_sha: ${{ steps.vars.outputs.kftools_repo_sha }}
      rkftools_repo_sha: ${{ steps.vars.outputs.rkftools_repo_sha }}
      radte_repo_sha: ${{ steps.vars.outputs.radte_repo_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preflight env coverage check
        shell: bash
        run: |
          set -euo pipefail
          container/scripts/check_env_coverage.sh .

      - name: Resolve image tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo_name="$(basename "${GITHUB_REPOSITORY}")"
          image="ghcr.io/${owner}/${repo_name}"
          date_tag="$(date -u +%Y%m%d)"
          short_sha="${GITHUB_SHA::7}"
          build_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          gg_version="$(sed -n '1p' VERSION | tr -d '\r')"

          source container/source_branches.env
          resolve_source_sha() {
            bash container/scripts/resolve_git_branch_sha.sh "$1" "$2"
          }
          amalgkit_repo_sha="$(resolve_source_sha https://github.com/kfuku52/amalgkit.git "${GG_SOURCE_AMALGKIT_REPO_REF}")"
          cdskit_repo_sha="$(resolve_source_sha https://github.com/kfuku52/cdskit.git "${GG_SOURCE_CDSKIT_REPO_REF}")"
          csubst_repo_sha="$(resolve_source_sha https://github.com/kfuku52/csubst.git "${GG_SOURCE_CSUBST_REPO_REF}")"
          nwkit_repo_sha="$(resolve_source_sha https://github.com/kfuku52/nwkit.git "${GG_SOURCE_NWKIT_REPO_REF}")"
          busco_repo_sha="$(resolve_source_sha https://gitlab.com/ezlab/busco.git "${GG_SOURCE_BUSCO_REPO_REF}")"
          paml_repo_sha="$(resolve_source_sha https://github.com/iqtree/paml.git "${GG_SOURCE_PAML_REPO_REF}")"
          kfl1ou_repo_sha="$(resolve_source_sha https://github.com/kfuku52/kfl1ou.git "${GG_SOURCE_KFL1OU_REPO_REF}")"
          kffractbias_repo_sha="$(resolve_source_sha https://github.com/kfuku52/kfFractBias.git "${GG_SOURCE_KFFRACTBIAS_REPO_REF}")"
          kftools_repo_sha="$(resolve_source_sha https://github.com/kfuku52/kftools.git "${GG_SOURCE_KFTOOLS_REPO_REF}")"
          rkftools_repo_sha="$(resolve_source_sha https://github.com/kfuku52/rkftools.git "${GG_SOURCE_RKFTOOLS_REPO_REF}")"
          radte_repo_sha="$(resolve_source_sha https://github.com/kfuku52/RADTE.git "${GG_SOURCE_RADTE_REPO_REF}")"
          source_revision_hash="$(
            printf '%s\n' \
              "${amalgkit_repo_sha}" \
              "${cdskit_repo_sha}" \
              "${csubst_repo_sha}" \
              "${nwkit_repo_sha}" \
              "${busco_repo_sha}" \
              "${paml_repo_sha}" \
              "${kfl1ou_repo_sha}" \
              "${kffractbias_repo_sha}" \
              "${kftools_repo_sha}" \
              "${rkftools_repo_sha}" \
              "${radte_repo_sha}" \
              | sha256sum | cut -c1-12
          )"
          immutable_tag="${date_tag}-${short_sha}-${source_revision_hash}"

          {
            echo "image=${image}"
            echo "immutable_tag=${immutable_tag}"
            echo "sha_tag=sha-${short_sha}"
            echo "build_date=${build_date}"
            echo "gg_version=${gg_version}"
            echo "amalgkit_repo_sha=${amalgkit_repo_sha}"
            echo "cdskit_repo_sha=${cdskit_repo_sha}"
            echo "csubst_repo_sha=${csubst_repo_sha}"
            echo "nwkit_repo_sha=${nwkit_repo_sha}"
            echo "busco_repo_sha=${busco_repo_sha}"
            echo "paml_repo_sha=${paml_repo_sha}"
            echo "kfl1ou_repo_sha=${kfl1ou_repo_sha}"
            echo "kffractbias_repo_sha=${kffractbias_repo_sha}"
            echo "kftools_repo_sha=${kftools_repo_sha}"
            echo "rkftools_repo_sha=${rkftools_repo_sha}"
            echo "radte_repo_sha=${radte_repo_sha}"
          } >> "${GITHUB_OUTPUT}"

  build-and-push:
    needs: prepare-build
    if: needs.prepare-build.result == 'success'
    name: build-and-push (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve platform
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          echo "pair=${platform//\//-}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Compute build input hash
        id: build-input
        shell: bash
        env:
          GG_BUILD_PLATFORMS: ${{ matrix.platform }}
          GG_BUILD_VCS_REF: ${{ github.sha }}
          GG_BUILD_VERSION: ${{ needs.prepare-build.outputs.gg_version }}
          KFU52_AMALGKIT_REPO_SHA: ${{ needs.prepare-build.outputs.amalgkit_repo_sha }}
          KFU52_CDSKIT_REPO_SHA: ${{ needs.prepare-build.outputs.cdskit_repo_sha }}
          KFU52_CSUBST_REPO_SHA: ${{ needs.prepare-build.outputs.csubst_repo_sha }}
          KFU52_NWKIT_REPO_SHA: ${{ needs.prepare-build.outputs.nwkit_repo_sha }}
          BUSCO_REPO_SHA: ${{ needs.prepare-build.outputs.busco_repo_sha }}
          PAML_REPO_SHA: ${{ needs.prepare-build.outputs.paml_repo_sha }}
          KFL1OU_REPO_SHA: ${{ needs.prepare-build.outputs.kfl1ou_repo_sha }}
          KFFRACTBIAS_REPO_SHA: ${{ needs.prepare-build.outputs.kffractbias_repo_sha }}
          KFTOOLS_REPO_SHA: ${{ needs.prepare-build.outputs.kftools_repo_sha }}
          RKFTOOLS_REPO_SHA: ${{ needs.prepare-build.outputs.rkftools_repo_sha }}
          RADTE_REPO_SHA: ${{ needs.prepare-build.outputs.radte_repo_sha }}
        run: echo "value=$(bash container/scripts/compute_build_input_hash.sh)" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: container/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: >-
            type=image,name=${{ needs.prepare-build.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ needs.prepare-build.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            GG_VERSION=${{ needs.prepare-build.outputs.gg_version }}
            BUILD_INPUT_HASH=${{ steps.build-input.outputs.value }}
            KFU52_REPO_REF=master
            KFU52_AMALGKIT_REPO_REF=master
            KFU52_AMALGKIT_REPO_SHA=${{ needs.prepare-build.outputs.amalgkit_repo_sha }}
            KFU52_CDSKIT_REPO_REF=master
            KFU52_CDSKIT_REPO_SHA=${{ needs.prepare-build.outputs.cdskit_repo_sha }}
            KFU52_CSUBST_REPO_REF=master
            KFU52_CSUBST_REPO_SHA=${{ needs.prepare-build.outputs.csubst_repo_sha }}
            KFU52_NWKIT_REPO_REF=master
            KFU52_NWKIT_REPO_SHA=${{ needs.prepare-build.outputs.nwkit_repo_sha }}
            BUSCO_REPO_REF=master
            BUSCO_REPO_SHA=${{ needs.prepare-build.outputs.busco_repo_sha }}
            PAML_REPO_REF=master
            PAML_REPO_SHA=${{ needs.prepare-build.outputs.paml_repo_sha }}
            KFL1OU_REPO_REF=main
            KFL1OU_REPO_SHA=${{ needs.prepare-build.outputs.kfl1ou_repo_sha }}
            KFFRACTBIAS_REPO_REF=master
            KFFRACTBIAS_REPO_SHA=${{ needs.prepare-build.outputs.kffractbias_repo_sha }}
            KFTOOLS_REPO_SHA=${{ needs.prepare-build.outputs.kftools_repo_sha }}
            RKFTOOLS_REPO_SHA=${{ needs.prepare-build.outputs.rkftools_repo_sha }}
            RADTE_REPO_SHA=${{ needs.prepare-build.outputs.radte_repo_sha }}
          cache-from: type=gha,scope=container-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=container-${{ steps.platform.outputs.pair }}

      - name: Validate current csubst scan runtime and database import
        shell: bash
        env:
          IMAGE: ${{ needs.prepare-build.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" ]]; then
            echo "docker/build-push-action did not return an image digest."
            exit 1
          fi
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            "${IMAGE}@${DIGEST}" \
            python -m pytest -q workflow/tests/test_csubst_scan_runtime_integration.py

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if [[ -z "${digest}" ]]; then
            echo "docker/build-push-action did not return an image digest."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    needs:
      - check-trigger
      - prepare-build
      - build-and-push
    if: |
      needs.prepare-build.result == 'success' &&
      needs.build-and-push.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        shell: bash
        env:
          IMAGE: ${{ needs.prepare-build.outputs.image }}
          IMMUTABLE_TAG: ${{ needs.prepare-build.outputs.immutable_tag }}
          SHA_TAG: ${{ needs.prepare-build.outputs.sha_tag }}
        run: |
          set -euo pipefail
          mapfile -t digests < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#digests[@]}."
            exit 1
          fi

          refs=()
          for digest in "${digests[@]}"; do
            refs+=("${IMAGE}@sha256:${digest}")
          done

          immutable_exists=0
          if existing_manifest="$(docker buildx imagetools inspect --raw "${IMAGE}:${IMMUTABLE_TAG}" 2>/dev/null)"; then
            immutable_exists=1
            planned_manifest="$(docker buildx imagetools create --dry-run --progress=none "${refs[@]}")"
            planned_fingerprint="$(
              jq -S -c '{schemaVersion, mediaType, manifests}' <<< "${planned_manifest}" | sha256sum | cut -d' ' -f1
            )"
            existing_fingerprint="$(
              jq -S -c '{schemaVersion, mediaType, manifests}' <<< "${existing_manifest}" | sha256sum | cut -d' ' -f1
            )"
            if [[ "${planned_fingerprint}" != "${existing_fingerprint}" ]]; then
              echo "Refusing to overwrite immutable image tag with different content: ${IMAGE}:${IMMUTABLE_TAG}"
              exit 1
            fi
            echo "Immutable image tag already matches the planned manifest; reusing it."
          fi

          manifest_tags=(
            --tag "${IMAGE}:${SHA_TAG}"
            --tag "${IMAGE}:latest"
          )
          if [[ "${immutable_exists}" == "0" ]]; then
            manifest_tags+=(--tag "${IMAGE}:${IMMUTABLE_TAG}")
          fi
          docker buildx imagetools create "${manifest_tags[@]}" "${refs[@]}"

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Build trigger:"
            echo "- ${{ needs.check-trigger.outputs.decision_reason }}"
            echo "- successful baseline: ${{ needs.check-trigger.outputs.baseline_sha }}"
            echo "- matched paths: ${{ needs.check-trigger.outputs.matched_files }}"
            echo ""
            echo "Pushed image tags:"
            echo "- ${{ needs.prepare-build.outputs.image }}:${{ needs.prepare-build.outputs.immutable_tag }}"
            echo "- ${{ needs.prepare-build.outputs.image }}:${{ needs.prepare-build.outputs.sha_tag }}"
            echo "- ${{ needs.prepare-build.outputs.image }}:latest"
            echo ""
            echo "Platforms:"
            echo "- linux/amd64"
            echo "- linux/arm64"
          } >> "${GITHUB_STEP_SUMMARY}"
