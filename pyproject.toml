[tool.pytest.ini_options]
testpaths = ["workflow/tests"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
  "fast: dependency-light tests intended for the main Python feedback job",
  "integration: multi-component workflow and CLI integration tests",
  "network: tests that are explicitly allowed to access a non-loopback network endpoint",
  "runtime: tests that require tools or packages from the GeneGalleon runtime",
  "slow: tests kept outside the fast feedback lane",
  "smoke: minimal high-signal tests used as the CI preflight gate",
  "static: source, configuration, and workflow structure checks",
]
norecursedirs = [
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  "workspace",
  "output",
  "tmp",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
  "workspace",
  "output",
  "tmp",
  "workflow/support/treevis",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"workflow/support/*.py" = ["E402"]
