[tool.pytest.ini_options]
testpaths = ["workflow/tests"]
norecursedirs = [
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  "workspace",
  "output",
  "tmp",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
  "workspace",
  "output",
  "tmp",
  "workflow/support/treevis",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"workflow/support/*.py" = ["E402"]
